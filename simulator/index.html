<!DOCTYPE html>
<!--
  index.html — FlyteOS Simulator 模块化入口页面
  ============================================================================
  功能：Cesium 3D 飞行模拟器的 HTML 骨架，通过 CDN 加载 Cesium 1.120，
        按依赖顺序加载核心 JS 模块，提供左右分栏布局。
  架构：
    左栏（70%）— #cesiumContainer   Cesium 3D 地球渲染区
    右栏（30%）— #panel-container   功能面板区（HUD / 围栏 / 控制 / 日志）
  依赖加载顺序：
    1. Cesium 1.120 CDN（CSS + JS）
    2. core/event_bus.js       — 事件总线（零依赖）
    3. core/state_manager.js   — 状态管理器（依赖 EventBus）
    4. core/cesium_core.js     — Cesium 封装（依赖 Cesium + EventBus + StateManager）
    5. app.js                  — 应用入口（依赖上述全部）
  接口：无（纯入口页面）
  ============================================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyteOS Simulator — M1 Phase 1</title>

  <!-- Cesium 1.120 CDN -->
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>

  <style>
    /* ============================================================
       全局重置
       ============================================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #0a0e1a;
      color: #e0e0e0;
    }

    /* ============================================================
       主布局：左右分栏
       ============================================================ */
    .app-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* ---- 左栏：Cesium 3D 视图（70%） ---- */
    .cesium-pane {
      flex: 0 0 70%;
      height: 100%;
      position: relative;
      border-right: 2px solid #1a2a4a;
    }

    #cesiumContainer {
      width: 100%;
      height: 100%;
    }

    /* Cesium 信用信息位置微调 */
    .cesium-pane .cesium-viewer-credits {
      display: none !important;
    }

    /* ---- 右栏：功能面板区（30%） ---- */
    .panel-pane {
      flex: 0 0 30%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0d1225;
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 16px;
      background: linear-gradient(180deg, #141e3a, #0d1225);
      border-bottom: 1px solid #1e3050;
      text-align: center;
    }

    .panel-header h2 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #4ea8ff;
    }

    .panel-header .version {
      font-size: 11px;
      color: #556688;
      margin-top: 2px;
    }

    /* 面板区域滚动容器 */
    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    /* 通用面板卡片样式 */
    .panel-card {
      background: #101830;
      border: 1px solid #1a2a4a;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .panel-card h3 {
      font-size: 13px;
      color: #6a9fd8;
      margin-bottom: 8px;
      border-bottom: 1px solid #1a2a4a;
      padding-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ---- HUD 遥测面板 ---- */
    #hud-panel .telemetry-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 12px;
    }

    .telemetry-label {
      color: #8899bb;
    }

    .telemetry-value {
      color: #4ef0a0;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .telemetry-value.warn {
      color: #f0a04e;
    }

    .telemetry-value.danger {
      color: #f04e4e;
    }

    /* ---- Geofence 面板 ---- */
    #gf-panel .gf-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
    }

    .gf-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .gf-clear    { background: #4ef0a0; }
    .gf-warning  { background: #f0a04e; }
    .gf-violated { background: #f04e4e; }

    #gf-log {
      max-height: 120px;
      overflow-y: auto;
      font-size: 11px;
      color: #8899bb;
    }

    #gf-log div {
      padding: 2px 0;
      border-bottom: 1px solid #0d1225;
    }

    /* ---- 控制按钮栏 ---- */
    #ctrl-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 0;
    }

    #ctrl-bar button {
      flex: 1 1 calc(50% - 6px);
      min-width: 60px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #1a2a4a;
      border-radius: 4px;
      background: #141e3a;
      color: #c0d0f0;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }

    #ctrl-bar button:hover {
      background: #1e3050;
      border-color: #4ea8ff;
      color: #fff;
    }

    #ctrl-bar button:active {
      transform: scale(0.97);
    }

    #ctrl-bar button.primary {
      background: #1a4a6e;
      border-color: #2a6a9e;
    }

    #ctrl-bar button.danger {
      background: #4a1a1a;
      border-color: #6e2a2a;
    }

    /* ---- 状态栏 ---- */
    .status-bar {
      padding: 6px 12px;
      background: #0a0e1a;
      border-top: 1px solid #1a2a4a;
      font-size: 11px;
      color: #556688;
      display: flex;
      justify-content: space-between;
    }

    .status-fps {
      color: #4ea8ff;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    /* ---- 滚动条美化 ---- */
    .panel-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .panel-scroll::-webkit-scrollbar-track {
      background: #0a0e1a;
    }

    .panel-scroll::-webkit-scrollbar-thumb {
      background: #1e3050;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<div class="app-layout">
  <!-- ========== 左栏：Cesium 3D 视图 ========== -->
  <div class="cesium-pane">
    <div id="cesiumContainer"></div>
  </div>

  <!-- ========== 右栏：功能面板区 ========== -->
  <div class="panel-pane">
    <!-- 标题栏 -->
    <div class="panel-header">
      <h2>FLYTEOS SIMULATOR</h2>
      <div class="version">M1 Phase 3 — 8 Panel Modules</div>
    </div>

    <!-- 可滚动面板区域 -->
    <div class="panel-scroll">

      <!-- HUD 遥测面板 -->
      <div class="panel-card" id="hud-panel">
        <h3>Telemetry HUD</h3>
        <div class="telemetry-row">
          <span class="telemetry-label">Lat</span>
          <span class="telemetry-value" id="hud-lat">--</span>
        </div>
        <div class="telemetry-row">
          <span class="telemetry-label">Lng</span>
          <span class="telemetry-value" id="hud-lng">--</span>
        </div>
        <div class="telemetry-row">
          <span class="telemetry-label">Alt</span>
          <span class="telemetry-value" id="hud-alt">--</span>
        </div>
        <div class="telemetry-row">
          <span class="telemetry-label">Spd</span>
          <span class="telemetry-value" id="hud-spd">--</span>
        </div>
        <div class="telemetry-row">
          <span class="telemetry-label">Hdg</span>
          <span class="telemetry-value" id="hud-hdg">--</span>
        </div>
        <div class="telemetry-row">
          <span class="telemetry-label">Phase</span>
          <span class="telemetry-value" id="hud-phase">--</span>
        </div>
      </div>

      <!-- Geofence 状态面板 -->
      <div class="panel-card" id="gf-panel">
        <h3>Geofence Status</h3>
        <div id="gf-status-list">
          <div class="gf-status-row">
            <span><span class="gf-indicator gf-clear"></span>Zone A</span>
            <span class="telemetry-value" id="gf-zone-a">CLEAR</span>
          </div>
          <div class="gf-status-row">
            <span><span class="gf-indicator gf-clear"></span>Zone B</span>
            <span class="telemetry-value" id="gf-zone-b">CLEAR</span>
          </div>
          <div class="gf-status-row">
            <span><span class="gf-indicator gf-clear"></span>Zone C</span>
            <span class="telemetry-value" id="gf-zone-c">CLEAR</span>
          </div>
        </div>
        <div id="gf-log">
          <div style="color:#556688;">-- 违规事件日志 --</div>
        </div>
      </div>

      <!-- 控制按钮栏 -->
      <div class="panel-card">
        <h3>Controls</h3>
        <div id="ctrl-bar">
          <button class="primary" id="btn-start">Start</button>
          <button id="btn-pause">Pause</button>
          <button id="btn-resume">Resume</button>
          <button class="danger" id="btn-stop">Stop</button>
        </div>
      </div>

    </div><!-- .panel-scroll -->

    <!-- 底部状态栏 -->
    <div class="status-bar">
      <span id="status-text">Demo Status: IDLE</span>
      <span class="status-fps" id="status-fps">FPS: --</span>
    </div>
  </div><!-- .panel-pane -->
</div><!-- .app-layout -->

<!-- ============================================================
     核心 JS 模块加载（按依赖顺序）
     ============================================================ -->
<script src="core/event_bus.js"></script>
<script src="core/state_manager.js"></script>
<script src="core/cesium_core.js"></script>

<!-- ============================================================
     Phase 2 面板模块（M1 Phase 2 — 独立 IIFE 模块）
     ============================================================ -->
<script src="panels/flight_panel.js"></script>
<script src="panels/sensor_panel.js"></script>
<script src="panels/health_panel.js"></script>
<script src="panels/log_panel.js"></script>

<!-- ============================================================
     Phase 3 面板模块（M1 Phase 3 — 任务/编队/回放/故障树）
     ============================================================ -->
<script src="panels/task_panel.js"></script>
<script src="panels/formation_panel.js"></script>
<script src="panels/replay_panel.js"></script>
<script src="panels/fault_tree_panel.js"></script>

<!-- ============================================================
     Phase 1 启动入口（后续替换为 app.js）
     ============================================================ -->
<script>
  (function () {
    'use strict';

    console.log('[M1 Phase 3] Core + 8 Panels loaded.');
    console.log('  - EventBus:', typeof EventBus !== 'undefined' ? 'OK' : 'MISSING');
    console.log('  - StateManager:', typeof StateManager !== 'undefined' ? 'OK' : 'MISSING');
    console.log('  - Cesium:', typeof Cesium !== 'undefined' ? 'OK' : 'MISSING');
    console.log('  - CesiumCore:', typeof CesiumCore !== 'undefined' ? 'OK' : 'MISSING');
    console.log('  - Panels.flight:', typeof Panels !== 'undefined' && Panels.flight ? 'OK' : 'MISSING');
    console.log('  - Panels.sensor:', typeof Panels !== 'undefined' && Panels.sensor ? 'OK' : 'MISSING');
    console.log('  - Panels.health:', typeof Panels !== 'undefined' && Panels.health ? 'OK' : 'MISSING');
    console.log('  - Panels.log:', typeof Panels !== 'undefined' && Panels.log ? 'OK' : 'MISSING');
    console.log('  - Panels.task:', typeof Panels !== 'undefined' && Panels.task ? 'OK' : 'MISSING');
    console.log('  - Panels.formation:', typeof Panels !== 'undefined' && Panels.formation ? 'OK' : 'MISSING');
    console.log('  - Panels.replay:', typeof Panels !== 'undefined' && Panels.replay ? 'OK' : 'MISSING');
    console.log('  - Panels.faultTree:', typeof Panels !== 'undefined' && Panels.faultTree ? 'OK' : 'MISSING');

    // ── 初始化 Cesium Viewer ──
    try {
      CesiumCore.initialize('cesiumContainer', {
        terrainProvider: Cesium.createWorldTerrain(),
      });

      CesiumCore.setCamera({ lng: 121.47, lat: 31.23, alt: 0 }, {
        heading: 0, pitch: -45, range: 15000,
      });

      CesiumCore.addAircraft('UAV-Demo', { lng: 121.47, lat: 31.23, alt: 2000 });
      document.getElementById('status-text').textContent = 'Demo Status: READY';
    } catch (err) {
      console.error('[M1 Phase 2] Initialization failed:', err);
      document.getElementById('status-text').textContent = 'Demo Status: ERROR - ' + err.message;
    }

    // ── 初始化面板（挂载到 panel-scroll 容器）──
    try {
      Panels.flight.init('panel-scroll');
      Panels.sensor.init('panel-scroll');
      Panels.health.init('panel-scroll');
      Panels.log.init('panel-scroll');
      Panels.task.init('panel-scroll');
      Panels.formation.init('panel-scroll');
      Panels.replay.init('panel-scroll');
      Panels.faultTree.init('panel-scroll');
    } catch (err) {
      console.error('[M1 Phase 3] Panel init failed:', err);
    }

    // ── 注入初始状态数据 ──
    StateManager.set('flight', {
      lat: 31.230000, lng: 121.470000, alt: 2000,
      spd: 45.5, hdg: 90, vertRate: 2.3,
      phase: 'CRUISE', wpLabel: 'WP3 (Shanghai)',
      gfStatus: 'safe', gpsSats: 14,
    });

    StateManager.set('sensors', {
      IMU: 450, BARO: 1013, GPS: 14, MAG: 48,
    });

    StateManager.set('health', {
      overall: 93,
      subsystems: { battery: 85, motors: 88, comm: 92, navigation: 97 },
      batteryRemaining: 3540,
    });

    // Phase 3 种子数据
    StateManager.set('task', {
      routeVisible: true,
      wpVisible: true,
      gfVisible: true,
    });

    StateManager.set('formation', {
      shape: 'Wedge',
      spacing: { lateral: 80, longitudinal: 80, altitude: 10 },
    });

    StateManager.set('replay', {
      playing: false,
      speed: 1.0,
      progress: 0,
    });

    // ── 控制按钮事件（EventBus）──
    document.getElementById('btn-start').addEventListener('click', function () {
      EventBus.emit('demo:start');
      StateManager.set('flight', Object.assign(StateManager.get('flight') || {}, { phase: 'TAKEOFF' }));
      document.getElementById('status-text').textContent = 'Demo Status: RUNNING';
    });
    document.getElementById('btn-pause').addEventListener('click', function () {
      EventBus.emit('demo:pause');
      StateManager.set('flight', Object.assign(StateManager.get('flight') || {}, { phase: 'PAUSED' }));
      document.getElementById('status-text').textContent = 'Demo Status: PAUSED';
    });
    document.getElementById('btn-resume').addEventListener('click', function () {
      EventBus.emit('demo:resume');
      StateManager.set('flight', Object.assign(StateManager.get('flight') || {}, { phase: 'CRUISE' }));
      document.getElementById('status-text').textContent = 'Demo Status: RUNNING';
    });
    document.getElementById('btn-stop').addEventListener('click', function () {
      EventBus.emit('demo:stop');
      StateManager.set('flight', Object.assign(StateManager.get('flight') || {}, { phase: 'STOPPED' }));
      document.getElementById('status-text').textContent = 'Demo Status: STOPPED';
    });

    // ── 键盘快捷键 ──
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space') { e.preventDefault(); EventBus.emit('demo:toggle'); }
      else if (e.code === 'Escape') { EventBus.emit('demo:stop'); }
    });

    console.log('[M1 Phase 3] All 8 panels initialized and state seeded.');
  })();
</script>

</body>
</html>
