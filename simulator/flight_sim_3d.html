<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>福莱特浮空飞行器 — 3D飞行仿真</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050d1f;color:#e0f0ff;font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden;width:100vw;height:100vh}
#main{position:relative;width:100vw;height:100vh}
#c{position:absolute;top:0;left:0;width:100%;height:100%}

/* HUD */
#hud-title{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,15,40,.88);border:1px solid #1a6aff55;padding:7px 28px;border-radius:24px;font-size:14px;color:#7dd4fc;letter-spacing:2px}
#panel-l{position:absolute;top:60px;left:14px;background:rgba(0,10,30,.85);border:1px solid #1a4aff33;border-radius:10px;padding:12px 16px;width:200px;font-size:12px;line-height:2}
#panel-r{position:absolute;top:60px;right:14px;background:rgba(0,10,30,.85);border:1px solid #1a4aff33;border-radius:10px;padding:12px 16px;width:210px;font-size:12px;line-height:1.8}
.ph{color:#7dd4fc;font-size:11px;letter-spacing:1px;border-bottom:1px solid #1a4aff33;padding-bottom:3px;margin-bottom:6px}
.pr{display:flex;justify-content:space-between}
.pl{color:#8899aa}.pv{color:#00e5ff;font-family:monospace;font-weight:bold}
.pv.g{color:#00ff88}.pv.y{color:#ffd700}.pv.r{color:#ff4444}
.bar-row{margin:4px 0}
.bar-lbl{color:#8899aa;font-size:11px}
.bar-bg{height:5px;background:#1a2a3a;border-radius:3px;margin-top:2px}
.bar-f{height:100%;border-radius:3px;transition:width .4s}
#panel-b{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,10,30,.85);border:1px solid #1a4aff33;border-radius:10px;padding:7px 20px;display:flex;gap:24px;font-size:12px}
.si{display:flex;align-items:center;gap:6px}
.sd{width:7px;height:7px;border-radius:50%}
.g2{background:#00ff88;box-shadow:0 0 5px #00ff88;animation:blink 1.5s infinite}
.y2{background:#ffd700;box-shadow:0 0 5px #ffd700}
.b2{background:#00e5ff;box-shadow:0 0 5px #00e5ff}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#btns{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;gap:7px}
.btn{background:rgba(0,15,50,.85);border:1px solid #1a6aff44;color:#7dd4fc;padding:7px 14px;border-radius:7px;cursor:pointer;font-size:12px;letter-spacing:1px}
.btn:hover{background:rgba(26,106,255,.22);border-color:#1a6aff}
.btn.on{background:rgba(0,229,255,.15);border-color:#00e5ff;color:#00e5ff}
#log{position:absolute;bottom:60px;left:14px;background:rgba(0,8,22,.8);border:1px solid #1a4aff22;border-radius:8px;padding:7px 12px;width:260px;font-size:11px}
#log h4{color:#445566;font-size:10px;letter-spacing:1px;margin-bottom:3px}
.le{color:#445566;line-height:1.7}.le.n{color:#00e5ff}.le.w{color:#ffd700}
#mm{position:absolute;bottom:60px;right:14px;width:150px;height:150px;background:rgba(0,8,22,.85);border:1px solid #1a4aff33;border-radius:8px;overflow:hidden}
#mmc{width:150px;height:150px}
</style>
</head>
<body>
<div id="main">
<canvas id="c"></canvas>
<div id="hud-title">⬡ 福莱特浮空飞行器 FlyteOS v1.0 — 3D飞行仿真</div>
<div id="panel-l">
  <div class="ph">▶ 飞行参数</div>
  <div class="pr"><span class="pl">状态</span><span class="pv g" id="pState">起飞</span></div>
  <div class="pr"><span class="pl">位置 X</span><span class="pv" id="pX">0.0 m</span></div>
  <div class="pr"><span class="pl">位置 Y</span><span class="pv" id="pY">0.0 m</span></div>
  <div class="pr"><span class="pl">高度 Z</span><span class="pv" id="pZ">0.0 m</span></div>
  <div class="pr"><span class="pl">速度</span><span class="pv" id="pSpd">0.0 m/s</span></div>
  <div class="pr"><span class="pl">航向</span><span class="pv" id="pYaw">0°</span></div>
  <div class="pr"><span class="pl">俯仰</span><span class="pv" id="pPitch">0°</span></div>
  <div class="pr"><span class="pl">时间</span><span class="pv y" id="pTime">0s</span></div>
  <div class="pr"><span class="pl">航点</span><span class="pv" id="pWP">0/5</span></div>
</div>
<div id="panel-r">
  <div class="ph">⚡ 能源系统</div>
  <div class="bar-row"><div class="bar-lbl">电池电量 <span id="vBat">100%</span></div><div class="bar-bg"><div class="bar-f" id="bBat" style="width:100%;background:#00ff88"></div></div></div>
  <div class="bar-row" style="margin-top:8px"><div class="bar-lbl">太阳能 <span id="vSol" style="color:#ffd700">60%</span></div><div class="bar-bg"><div class="bar-f" id="bSol" style="width:60%;background:#ffd700"></div></div></div>
  <div class="bar-row" style="margin-top:8px"><div class="bar-lbl">氦气浮力 <span id="vHel" style="color:#a78bfa">70%</span></div><div class="bar-bg"><div class="bar-f" id="bHel" style="width:70%;background:#a78bfa"></div></div></div>
  <div class="bar-row" style="margin-top:8px"><div class="bar-lbl">涡轮推力 <span id="vTurb" style="color:#f97316">30%</span></div><div class="bar-bg"><div class="bar-f" id="bTurb" style="width:30%;background:#f97316"></div></div></div>
  <div style="margin-top:10px;border-top:1px solid #1a4aff22;padding-top:6px">
    <div class="pr"><span class="pl">系统温度</span><span class="pv" id="pTemp">32°C</span></div>
    <div class="pr"><span class="pl">风速</span><span class="pv" id="pWind">3.2 m/s</span></div>
  </div>
</div>
<div id="panel-b">
  <div class="si"><div class="sd g2"></div><span>飞控系统</span></div>
  <div class="si"><div class="sd g2"></div><span>导航模块</span></div>
  <div class="si"><div class="sd b2"></div><span>通信链路</span></div>
  <div class="si"><div class="sd g2"></div><span>MPPT控制器</span></div>
  <div class="si"><div class="sd y2"></div><span>氦气系统</span></div>
</div>
<div id="btns">
  <button class="btn on" id="bAuto" onclick="toggleAuto()">🤖 自主飞行</button>
  <button class="btn" onclick="setView(0)">📷 跟随视角</button>
  <button class="btn" onclick="setView(1)">🌐 俯视视角</button>
  <button class="btn" onclick="setView(2)">🎯 侧面视角</button>
  <button class="btn" onclick="resetSim()">🔄 重置</button>
</div>
<div id="log"><h4>MISSION LOG</h4><div id="logBody"></div></div>
<div id="mm"><canvas id="mmc" width="150" height="150"></canvas></div>
</div>

<script>
// ══════════════════════════════════════════════
// FlyteOS 3D 飞行仿真 — Canvas 2D 伪3D渲染
// ══════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const mmc = document.getElementById('mmc');
const mmx = mmc.getContext('2d');

let W, H;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── 飞行器状态 ───
const S = {
  x:0, y:0, z:0,
  vx:0, vy:0, vz:0,
  yaw:0, pitch:0, roll:0,
  tyaw:0, tpitch:0, troll:0,
  battery:100, solar:0.6, helium:0.7, turbine:0.3,
  temp:32, wind:3.2,
  speed:0, time:0,
  status:'起飞爬升', wpIdx:0,
  auto:true
};

// 航点
const WPS = [
  {x:0,   y:0,   z:50, n:'起飞点'},
  {x:120, y:0,   z:50, n:'WP1'},
  {x:120, y:100, z:60, n:'WP2'},
  {x:0,   y:100, z:50, n:'WP3'},
  {x:-80, y:50,  z:55, n:'WP4'},
  {x:0,   y:0,   z:5,  n:'降落'},
];

// 相机
let viewMode = 0; // 0=follow 1=top 2=side
const cam = { x:0, y:-30, z:80, tx:0, ty:0, tz:50 };

// 轨迹
const trail = [];
const MAX_TRAIL = 800;

// 日志
const logs = [];
function log(msg, type=''){
  const t = Math.floor(S.time);
  logs.unshift({msg:`[${String(t).padStart(3)}s] ${msg}`, type});
  if(logs.length>10) logs.pop();
  renderLog();
}
function renderLog(){
  document.getElementById('logBody').innerHTML =
    logs.slice(0,6).map((l,i)=>`<div class="le ${i===0?l.type||'n':''}">${l.msg}</div>`).join('');
}

// ─── 物理仿真 ───
function physics(dt){
  if(!S.auto) return;
  S.time += dt;
  const wp = WPS[S.wpIdx];
  const dx=wp.x-S.x, dy=wp.y-S.y, dz=wp.z-S.z;
  const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);

  if(dist<5 && S.wpIdx<WPS.length-1){
    const old=WPS[S.wpIdx].n;
    S.wpIdx++;
    log(`✅ 到达 ${old}，前往 ${WPS[S.wpIdx].n}`, 'n');
    if(S.wpIdx===WPS.length-1){ S.status='返航降落'; log('🏁 开始返航','w'); }
    else if(S.wpIdx===1) S.status='巡航飞行';
  }
  if(S.wpIdx===WPS.length-1 && S.z<2 && dist<4){ resetSim(); return; }

  // 速度控制
  const spd = Math.min(10, dist*0.4);
  const f = dist>0.1 ? spd/dist : 0;
  S.vx += (dx*f - S.vx)*2.5*dt;
  S.vy += (dy*f - S.vy)*2.5*dt;
  S.vz += (dz*0.7 - S.vz)*2.0*dt;
  const vl=Math.sqrt(S.vx**2+S.vy**2+S.vz**2);
  if(vl>12){ const r=12/vl; S.vx*=r; S.vy*=r; S.vz*=r; }
  S.speed=vl;
  S.x+=S.vx*dt; S.y+=S.vy*dt; S.z=Math.max(0,S.z+S.vz*dt);

  // 姿态
  // 降落阶段：保持机头朝向目标点
  if(S.wpIdx===WPS.length-1 && S.z>2){
    const tdx=wp.x-S.x, tdy=wp.y-S.y;
    S.tyaw=Math.atan2(tdy,tdx);
    S.tpitch=-0.3;
    S.troll=0;
  } else if(vl>0.5){
    S.tyaw=Math.atan2(S.vy,S.vx);
    S.tpitch=-Math.atan2(S.vz,Math.sqrt(S.vx**2+S.vy**2))*0.4;
    S.troll=(S.tyaw-S.yaw)*0.25;
    S.troll=Math.max(-.35,Math.min(.35,S.troll));
  }
  S.yaw  +=(S.tyaw  -S.yaw  )*3*dt;
  S.pitch+=(S.tpitch-S.pitch)*4*dt;
  S.roll +=(S.troll -S.roll )*4*dt;

  // 能源
  S.solar  = 0.5+0.4*Math.abs(Math.sin(S.time*0.018+1));
  S.helium = 0.62+0.18*Math.sin(S.time*0.012);
  S.turbine= 0.18+0.35*(vl/12);
  S.battery= Math.max(5, S.battery-(S.turbine*0.012-S.solar*0.009)*dt);
  S.temp   = 30+S.turbine*9+Math.sin(S.time*0.1)*1.5;
  S.wind   = 2.5+Math.sin(S.time*0.25)*1.8;

  // 轨迹
  trail.push({x:S.x,y:S.y,z:S.z});
  if(trail.length>MAX_TRAIL) trail.shift();
}

// ─── 伪3D投影 ───
// 相机跟随
function updateCam(){
  if(viewMode===0){
    const behind=25, up=12;
    const cy=Math.cos(S.yaw), sy=Math.sin(S.yaw);
    cam.x = S.x - cy*behind;
    cam.y = S.y - sy*behind;
    cam.z = S.z + up;
    cam.tx=S.x; cam.ty=S.y; cam.tz=S.z;
  } else if(viewMode===1){
    cam.x=S.x; cam.y=S.y; cam.z=S.z+160;
    cam.tx=S.x; cam.ty=S.y; cam.tz=S.z;
  } else {
    cam.x=S.x+60; cam.y=S.y+60; cam.z=S.z+25;
    cam.tx=S.x; cam.ty=S.y; cam.tz=S.z;
  }
}

// 世界→屏幕投影（透视）
function project(wx,wy,wz){
  // 相机空间
  const dx=wx-cam.x, dy=wy-cam.y, dz=wz-cam.z;
  // 前向
  const fxr=cam.tx-cam.x, fyr=cam.ty-cam.y, fzr=cam.tz-cam.z;
  const fl=Math.sqrt(fxr*fxr+fyr*fyr+fzr*fzr)||1;
  const fx=fxr/fl, fy=fyr/fl, fz=fzr/fl;
  // 右向
  let rx=-fy, ry=fx, rz=0;
  const rl=Math.sqrt(rx*rx+ry*ry)||1; rx/=rl; ry/=rl;
  // 上向
  const ux=ry*fz-rz*fy, uy=rz*fx-rx*fz, uz=rx*fy-ry*fx;
  // 投影
  const cx2=dx*rx+dy*ry+dz*rz;
  const cy2=dx*ux+dy*uy+dz*uz;
  const cz2=dx*fx+dy*fy+dz*fz;
  if(cz2<0.5) return null;
  const fov=700; // 更大FOV = 更近视觉感
  const sx= W/2 + cx2/cz2*fov;
  const sy= H/2 - cy2/cz2*fov;
  const scale= fov/cz2;
  return {sx,sy,scale,cz:cz2};
}

// ─── 绘制飞行器 ───
function drawAirship(p, yaw, pitch, roll, scale){
  if(!p) return;
  const {sx,sy} = p;
  const s = Math.max(0.4, Math.min(12, scale));
  const sf = s * 22; // 基础大小因子（声明在最前）

  ctx.save();
  ctx.translate(sx, sy);
  // 俯视图：飞行器始终头朝上（北）
  // 其他视图：飞行器头朝航向
  const viewRot = viewMode===1 ? 0 : -yaw;
  ctx.rotate(viewRot);

  // ── 外发光效果 ──
  const glowGrd = ctx.createRadialGradient(0,0,sf*0.3, 0,0,sf*1.8);
  glowGrd.addColorStop(0,'rgba(0,200,255,0.18)');
  glowGrd.addColorStop(1,'rgba(0,100,255,0)');
  ctx.fillStyle=glowGrd;
  ctx.beginPath(); ctx.ellipse(0,0,sf*1.8,sf*0.9,0,0,Math.PI*2); ctx.fill();

  // ── 机头指示器（三角形尖，朝飞行方向=向右=X+）──
  const noseX = sf * 1.1; // 气囊右侧为机头方向
  ctx.fillStyle = 'rgba(255,100,0,0.95)';
  ctx.beginPath();
  ctx.moveTo(noseX + sf*0.3, 0);
  ctx.lineTo(noseX - sf*0.05, -sf*0.12);
  ctx.lineTo(noseX - sf*0.05, sf*0.12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,80,0,0.8)';
  ctx.lineWidth=sf*0.04;
  ctx.beginPath(); ctx.moveTo(sf*0.2, 0); ctx.lineTo(noseX-sf*0.05, 0); ctx.stroke();

  // ── 方向箭头（与机头同向=向右=X+）──
  const arrowBase = sf * 1.05;
  const arrowTip  = sf * 1.65;
  ctx.fillStyle = 'rgba(255,220,60,0.9)';
  ctx.beginPath();
  ctx.moveTo(arrowTip, 0);
  ctx.lineTo(arrowBase - sf*0.2, -sf*0.13);
  ctx.lineTo(arrowBase - sf*0.06, 0);
  ctx.lineTo(arrowBase - sf*0.2, sf*0.13);
  ctx.closePath(); ctx.fill();


  // ── 气囊主体（椭圆）──
  // 长轴沿X轴（水平），短轴沿Y轴（垂直）
  const grd = ctx.createRadialGradient(-sf*0.2,-sf*0.15,sf*0.1, 0,0,sf*1.1);
  grd.addColorStop(0,'#c8d8ee');
  grd.addColorStop(0.4,'#7090b8');
  grd.addColorStop(1,'#203050');
  ctx.fillStyle = grd;
  ctx.strokeStyle = 'rgba(120,180,255,0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.ellipse(0, 0, sf*1.0, sf*0.42, 0, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();

  // 气囊高光
  const hl = ctx.createLinearGradient(-sf*0.5,-sf*0.3, sf*0.5,sf*0.1);
  hl.addColorStop(0,'rgba(255,255,255,0.35)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;
  ctx.beginPath();
  ctx.ellipse(-sf*0.1,-sf*0.08, sf*0.6, sf*0.2, 0, 0, Math.PI*2);
  ctx.fill();

  // 气囊竖线纹理（水平方向）
  ctx.strokeStyle='rgba(100,160,220,0.2)';
  ctx.lineWidth=0.5;
  for(let i=-3;i<=3;i++){
    const px=i*sf*0.28;
    if(Math.abs(px)>sf*0.95) continue;
    const hw=Math.sqrt(Math.max(0,1-(px/(sf*1.0))**2))*sf*0.42;
    ctx.beginPath(); ctx.moveTo(px,-hw); ctx.lineTo(px,hw); ctx.stroke();
  }

  // ── 太阳能板（顶部，椭圆上方）──
  ctx.fillStyle='#1a3a7a';
  ctx.strokeStyle='rgba(100,150,255,0.6)';
  ctx.lineWidth=0.6;
  ctx.beginPath();
  ctx.rect(-sf*0.75,-sf*0.46, sf*1.5, sf*0.12);
  ctx.fill(); ctx.stroke();
  // 电池格
  ctx.strokeStyle='rgba(80,120,200,0.5)';
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(-sf*0.75+i*sf*0.3,-sf*0.46);
    ctx.lineTo(-sf*0.75+i*sf*0.3,-sf*0.34);
    ctx.stroke();
  }

  // ── 吊舱（底部，椭圆下方）──
  const gg = ctx.createLinearGradient(0,-sf*0.08,0,sf*0.22);
  gg.addColorStop(0,'#1a3a6a'); gg.addColorStop(1,'#0a1f40');
  ctx.fillStyle=gg;
  ctx.strokeStyle='rgba(60,120,200,0.5)';
  ctx.lineWidth=0.7;
  ctx.beginPath();
  ctx.roundRect(-sf*0.38, sf*0.08, sf*0.76, sf*0.28, sf*0.05);
  ctx.fill(); ctx.stroke();
  // 舱窗
  ctx.fillStyle='rgba(0,200,255,0.3)';
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.ellipse(i*sf*0.18, sf*0.18, sf*0.07, sf*0.06, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // ── 尾翼（尾部，椭圆短轴方向）──
  ctx.fillStyle='rgba(80,140,220,0.6)';
  ctx.beginPath();
  ctx.moveTo(sf*1.0, 0);
  ctx.lineTo(sf*1.17, -sf*0.28);
  ctx.lineTo(sf*1.05, sf*0.06);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sf*1.0, 0);
  ctx.lineTo(sf*1.17, sf*0.28);
  ctx.lineTo(sf*1.05, -sf*0.06);
  ctx.closePath(); ctx.fill();

  // ── 螺旋桨（4个，左右两侧）──
  const propT = Date.now()*0.008 * (S.speed/5+0.5);
  const propPos = [
    [-sf*0.5, -sf*0.38],
    [ sf*0.5, -sf*0.38],
    [-sf*0.5,  sf*0.38],
    [ sf*0.5,  sf*0.38],
  ];
  propPos.forEach(([px,py],i)=>{
    ctx.save();
    ctx.translate(px,py);
    ctx.rotate(propT + i*Math.PI/2);
    ctx.strokeStyle='rgba(0,220,255,0.85)';
    ctx.lineWidth=sf*0.045;
    ctx.beginPath();
    ctx.moveTo(-sf*0.22,0); ctx.lineTo(sf*0.22,0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,-sf*0.22); ctx.lineTo(0,sf*0.22);
    ctx.stroke();
    // 桨盘
    ctx.strokeStyle='rgba(0,180,255,0.2)';
    ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.arc(0,0,sf*0.22,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  });

  // ── 导航灯（上下两侧，椭圆短轴方向）──
  const blink = Math.sin(Date.now()*0.004)>0;
  if(blink){
    ctx.fillStyle='#ff3030';
    ctx.beginPath(); ctx.arc(-sf*0.92,0,sf*0.05,0,Math.PI*2); ctx.fill(); // 左灯
    ctx.fillStyle='#30ff30';
    ctx.beginPath(); ctx.arc(sf*0.92,0,sf*0.05,0,Math.PI*2); ctx.fill(); // 右灯
  }

  ctx.restore();

  // 投影阴影
  const groundP = project(S.x, S.y, 0);
  if(groundP && groundP.cz < 200){
    const gs = groundP.scale * 18;
    const alpha = Math.max(0, 0.4 - S.z/120);
    ctx.save();
    ctx.translate(groundP.sx, groundP.sy);
    ctx.fillStyle = `rgba(0,100,200,${alpha})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, gs*1.0, gs*0.25, 0, 0, Math.PI*2); // 水平椭圆阴影
    ctx.fill();
    ctx.restore();
  }
}

// ─── 绘制地面网格 ───
function drawGround(){
  const GRID=30, RANGE=5;
  const cx=Math.round(S.x/GRID)*GRID, cy=Math.round(S.y/GRID)*GRID;
  for(let i=-RANGE;i<=RANGE;i++){
    for(let j=-RANGE;j<=RANGE;j++){
      const gx=cx+i*GRID, gy=cy+j*GRID;
      const corners=[
        project(gx,gy,0), project(gx+GRID,gy,0),
        project(gx+GRID,gy+GRID,0), project(gx,gy+GRID,0)
      ];
      if(corners.some(c=>!c||c.cz<0.5)) continue;
      const even=(i+j)%2===0;
      ctx.fillStyle = even?'rgba(8,20,50,0.6)':'rgba(5,14,36,0.6)';
      ctx.strokeStyle='rgba(30,80,160,0.25)';
      ctx.lineWidth=0.5;
      ctx.beginPath();
      ctx.moveTo(corners[0].sx, corners[0].sy);
      for(let k=1;k<4;k++) ctx.lineTo(corners[k].sx, corners[k].sy);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
  }
}

// ─── 绘制航点 ───
function drawWaypoints(){
  WPS.forEach((wp,i)=>{
    const p=project(wp.x, wp.y, wp.z);
    if(!p || p.cz<0.5) return;
    const r = Math.max(4, p.scale*5);
    let color = i<S.wpIdx?'#00ff88': i===S.wpIdx?'#ffd700':'#334466';
    // 已到达航点：填充圆
    if(i<S.wpIdx){
      ctx.fillStyle='rgba(0,255,136,0.2)';
      ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle=color; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,Math.PI*2); ctx.stroke();
    if(i===S.wpIdx){
      // 当前目标：脉冲光环
      const pulse = Math.sin(Date.now()*0.005)*0.3+0.5;
      ctx.strokeStyle=`rgba(255,215,0,${pulse})`;
      ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,r+5+Math.sin(Date.now()*0.007)*4,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='rgba(255,215,0,0.15)';
      ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,r+10+Math.sin(Date.now()*0.004)*5,0,Math.PI*2); ctx.stroke();
    }
    // 标签
    ctx.fillStyle = color;
    ctx.font = `bold ${Math.max(10,p.scale*7)}px monospace`;
    ctx.fillText(wp.n, p.sx+r+5, p.sy+4);

    // 垂直线到地面
    const gp = project(wp.x, wp.y, 0);
    if(gp && gp.cz>0.5){
      ctx.strokeStyle='rgba(50,100,180,0.2)';
      ctx.lineWidth=0.6;
      ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.moveTo(p.sx,p.sy); ctx.lineTo(gp.sx,gp.sy); ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  // 连线（粗一点）
  ctx.strokeStyle='rgba(60,120,200,0.25)';
  ctx.lineWidth=1.2;
  ctx.setLineDash([5,8]);
  ctx.beginPath();
  let first=true;
  WPS.forEach(wp=>{
    const p=project(wp.x,wp.y,wp.z);
    if(!p||p.cz<0.5){first=true;return;}
    first ? ctx.moveTo(p.sx,p.sy) : ctx.lineTo(p.sx,p.sy);
    first=false;
  });
  ctx.stroke(); ctx.setLineDash([]);
}

// ─── 绘制轨迹 ───
function drawTrail(){
  if(trail.length<2) return;
  for(let i=1;i<trail.length;i++){
    const p0=project(trail[i-1].x,trail[i-1].y,trail[i-1].z);
    const p1=project(trail[i].x,trail[i].y,trail[i].z);
    if(!p0||!p1||p0.cz<0.5||p1.cz<0.5) continue;
    const alpha = Math.max(0.08, (i/trail.length)*0.9);
    ctx.strokeStyle=`rgba(0,220,255,${alpha})`;
    ctx.lineWidth = Math.max(0.8, p1.scale * 0.4);
    ctx.beginPath(); ctx.moveTo(p0.sx,p0.sy); ctx.lineTo(p1.sx,p1.sy); ctx.stroke();
  }
  // 飞行器位置高亮点
  const ap = project(S.x,S.y,S.z);
  if(ap){
    ctx.strokeStyle='rgba(0,220,255,0.4)';
    ctx.lineWidth=0.8;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.arc(ap.sx,ap.sy,Math.max(3,ap.scale*3),0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ─── 绘制天空背景 ───
function drawSky(){
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#03080e');
  grd.addColorStop(0.5,'#050d1e');
  grd.addColorStop(1,'#081428');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  // 星星（固定伪随机）
  ctx.fillStyle='rgba(200,220,255,0.55)';
  for(let i=0;i<140;i++){
    const sx=(Math.sin(i*137.51)*0.5+0.5)*W;
    const sy=(Math.cos(i*97.35)*0.5+0.5)*H*0.65;
    const sr=0.4+Math.abs(Math.sin(i*29.3))*1.2;
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
  }
}

// ─── 迷你地图 ───
function drawMinimap(){
  mmx.fillStyle='#04091a'; mmx.fillRect(0,0,150,150);
  mmx.strokeStyle='#0f2040'; mmx.lineWidth=0.7;
  for(let g=0;g<150;g+=25){
    mmx.beginPath();mmx.moveTo(g,0);mmx.lineTo(g,150);mmx.stroke();
    mmx.beginPath();mmx.moveTo(0,g);mmx.lineTo(150,g);mmx.stroke();
  }
  const toM=(v,base)=>(v/220)*100+75;
  const mx2=(x)=>toM(x); const my2=(y)=>150-toM(y);

  // 轨迹
  if(trail.length>2){
    mmx.strokeStyle='rgba(0,180,255,0.4)'; mmx.lineWidth=1;
    mmx.beginPath();
    trail.forEach((t,i)=>{
      const px=mx2(t.x),py=my2(t.y);
      i===0?mmx.moveTo(px,py):mmx.lineTo(px,py);
    });
    mmx.stroke();
  }
  // 航点
  WPS.forEach((wp,i)=>{
    mmx.fillStyle=i<S.wpIdx?'#00ff88':i===S.wpIdx?'#ffd700':'#223355';
    mmx.beginPath(); mmx.arc(mx2(wp.x),my2(wp.y),3,0,Math.PI*2); mmx.fill();
  });
  // 飞行器（箭头朝yaw方向，箭头默认朝北-y方向）
  const ax=mx2(S.x), ay=my2(S.y);
  mmx.save(); mmx.translate(ax,ay); mmx.rotate(Math.PI/2 - S.yaw);
  mmx.fillStyle='#00e5ff';
  mmx.beginPath(); mmx.moveTo(0,-7); mmx.lineTo(4,4); mmx.lineTo(-4,4); mmx.closePath(); mmx.fill();
  mmx.restore();
  mmx.font='8px monospace'; mmx.fillStyle='#334455'; mmx.fillText('迷你地图',3,12);
}

// ─── HUD更新 ───
function updateHUD(){
  document.getElementById('pState').textContent=S.status;
  document.getElementById('pX').textContent=S.x.toFixed(1)+' m';
  document.getElementById('pY').textContent=S.y.toFixed(1)+' m';
  document.getElementById('pZ').textContent=S.z.toFixed(1)+' m';
  document.getElementById('pSpd').textContent=S.speed.toFixed(1)+' m/s';
  document.getElementById('pYaw').textContent=(S.yaw*180/Math.PI).toFixed(1)+'°';
  document.getElementById('pPitch').textContent=(S.pitch*180/Math.PI).toFixed(1)+'°';
  document.getElementById('pTime').textContent=Math.floor(S.time)+'s';
  document.getElementById('pWP').textContent=`${S.wpIdx}/${WPS.length-1}`;
  document.getElementById('pTemp').textContent=S.temp.toFixed(1)+'°C';
  document.getElementById('pWind').textContent=S.wind.toFixed(1)+' m/s';

  const bat=Math.max(0,Math.min(100,S.battery));
  document.getElementById('bBat').style.width=bat+'%';
  document.getElementById('vBat').textContent=bat.toFixed(0)+'%';
  document.getElementById('bBat').style.background=bat>30?'#00ff88':'#ff4444';

  const sol=Math.max(0,Math.min(100,S.solar*100));
  document.getElementById('bSol').style.width=sol+'%';
  document.getElementById('vSol').textContent=sol.toFixed(0)+'%';

  const hel=Math.max(0,Math.min(100,S.helium*100));
  document.getElementById('bHel').style.width=hel+'%';
  document.getElementById('vHel').textContent=hel.toFixed(0)+'%';

  const turb=Math.max(0,Math.min(100,S.turbine*100));
  document.getElementById('bTurb').style.width=turb+'%';
  document.getElementById('vTurb').textContent=turb.toFixed(0)+'%';
}

// ─── 主循环 ───
let last=null, frame=0;
function loop(ts){
  if(!last) { last=ts; log('🚀 FlyteOS 启动'); log('导航模块就绪'); }
  const dt=Math.min((ts-last)/1000, 0.05);
  last=ts; frame++;

  physics(dt);
  updateCam();

  ctx.clearRect(0,0,W,H);
  drawSky();
  drawGround();
  drawTrail();
  drawWaypoints();

  const p = project(S.x, S.y, S.z);
  drawAirship(p, S.yaw, S.pitch, S.roll, p ? p.scale : 1);

  if(frame%4===0){ updateHUD(); drawMinimap(); }
  requestAnimationFrame(loop);
}

// ─── 控制 ───
function toggleAuto(){
  S.auto=!S.auto;
  const b=document.getElementById('bAuto');
  b.textContent=S.auto?'🤖 自主飞行':'✋ 暂停';
  b.className='btn'+(S.auto?' on':'');
  log(S.auto?'自主飞行已启动':'飞控暂停','w');
}
function setView(v){ viewMode=v; log(['跟随视角','俯视视角','侧面视角'][v]); }
function resetSim(){
  S.x=S.y=S.z=0; S.vx=S.vy=S.vz=0;
  S.yaw=S.pitch=S.roll=0; S.battery=100; S.time=0;
  S.wpIdx=0; S.status='起飞爬升'; trail.length=0;
  log('🔄 仿真重置','w');
}

requestAnimationFrame(loop);
</script>
