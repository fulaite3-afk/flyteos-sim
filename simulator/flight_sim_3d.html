<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyteOS v1.1 - 实景飞行模拟器 | Wuhan Fulaite Aviation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Noto Sans SC', '微软雅黑', sans-serif;
        }
        
        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        /* HUD Overlay */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud-panel {
            position: absolute;
            background: rgba(0, 10, 20, 0.75);
            border: 1px solid rgba(0, 200, 255, 0.4);
            border-radius: 4px;
            padding: 12px 16px;
            color: #00d4ff;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }
        
        /* Title */
        #title-panel {
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            border-color: rgba(0, 200, 255, 0.6);
        }
        
        #title-panel h1 {
            font-size: 18px;
            font-weight: 700;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
            letter-spacing: 3px;
        }
        
        #title-panel .subtitle {
            font-size: 10px;
            color: #7ec8e3;
            margin-top: 4px;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        /* Telemetry */
        #telemetry {
            top: 80px;
            left: 16px;
            min-width: 180px;
        }
        
        .tele-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            align-items: center;
        }
        
        .tele-row:last-child {
            margin-bottom: 0;
        }
        
        .tele-label {
            color: #7ec8e3;
            font-size: 10px;
            margin-right: 12px;
        }
        
        .tele-value {
            color: #00d4ff;
            font-weight: 700;
            font-size: 14px;
            min-width: 70px;
            text-align: right;
        }
        
        .tele-unit {
            color: #5ba3b8;
            font-size: 10px;
            margin-left: 4px;
        }
        
        /* Status */
        #status-panel {
            top: 80px;
            right: 16px;
            min-width: 160px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: #333;
        }
        
        .status-dot.active {
            background: #00ff88;
            box-shadow: 0 0 6px #00ff88;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        /* Controls */
        #controls-panel {
            bottom: 16px;
            left: 16px;
            font-size: 10px;
            color: #5ba3b8;
            line-height: 1.8;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .key {
            display: inline-block;
            background: rgba(0, 200, 255, 0.15);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 3px;
            padding: 1px 6px;
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            color: #00d4ff;
            margin: 0 2px;
        }
        
        /* Flight Log */
        #log-panel {
            bottom: 16px;
            right: 16px;
            width: 300px;
            max-height: 200px;
            overflow: hidden;
        }
        
        .log-title {
            font-size: 11px;
            color: #7ec8e3;
            border-bottom: 1px solid rgba(0, 200, 255, 0.2);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        
        .log-entry {
            font-size: 10px;
            padding: 2px 0;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .log-entry .time {
            color: #5ba3b8;
            margin-right: 8px;
        }
        
        .log-entry.takeoff { color: #00ff88; }
        .log-entry.waypoint { color: #ffdd00; }
        .log-entry.warning { color: #ff6b35; }
        
        /* Minimap */
        #minimap {
            bottom: 230px;
            right: 16px;
            width: 160px;
            height: 120px;
            padding: 0;
            overflow: hidden;
            border-radius: 4px;
        }
        
        #minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }
        
        /* Location bar */
        #location-bar {
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 11px;
            color: #7ec8e3;
            padding: 8px 24px;
            white-space: nowrap;
        }
        
        /* Loading */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000810;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        #loading h2 {
            font-family: 'Orbitron', sans-serif;
            color: #00d4ff;
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        
        .loader {
            width: 200px;
            height: 3px;
            background: rgba(0, 200, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.3s;
        }
        
        .loader-text {
            color: #5ba3b8;
            font-size: 12px;
            margin-top: 12px;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        /* Crosshair */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 15;
        }
        
        .ch-h, .ch-v {
            position: absolute;
            background: rgba(0, 212, 255, 0.6);
        }
        
        .ch-h {
            width: 40px;
            height: 1px;
            top: 50%;
            left: 0;
        }
        
        .ch-v {
            width: 1px;
            height: 40px;
            left: 50%;
            top: 0;
        }
        
        .ch-circle {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1px solid rgba(0, 212, 255, 0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Altitude bar */
        #alt-bar {
            position: fixed;
            right: 200px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 200px;
            background: rgba(0, 10, 20, 0.6);
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-radius: 3px;
            z-index: 10;
        }
        
        #alt-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #00d4ff, #00ff88);
            border-radius: 2px;
            transition: height 0.2s;
        }
        
        #alt-text {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00d4ff;
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div id="loading">
        <h2>FLYTEO OS v1.1</h2>
        <div class="loader">
            <div class="loader-bar" id="loader-bar"></div>
        </div>
        <div class="loader-text" id="loader-text">正在加载模拟地形数据...</div>
    </div>
    
    <!-- 3D Canvas -->
    <canvas id="canvas3d"></canvas>
    
    <!-- Crosshair -->
    <div id="crosshair">
        <div class="ch-h"></div>

    </div>
    
    <!-- HUD -->
    <div id="hud">
        <!-- Title -->
        <div class="hud-panel" id="title-panel">
            <h1>FLYTEO OS v1.1</h1>
            <div class="subtitle">武汉福莱特航空科技 · 开源浮空飞行器模拟器</div>

        <!-- Telemetry -->
        <div class="hud-panel" id="telemetry">

        <!-- Status -->
        <div class="hud-panel" id="status-panel">
            <div class="status-item">

            </div>
            <div class="status-item">
                <div class="status-dot active"></div>

            </div>
            <div class="status-item">
                <div class="status-dot active"></div>
                <span>地形数据</span>
            </div>
            <div class="status-item">
                <div class="status-dot active"></div>
                <span>卫星图源</span>
            </div>
            <div class="status-item">
                <div class="status-dot active"></div>

            </div>
        </div>
        
        <!-- Minimap -->
        <div class="hud-panel" id="minimap">
            <canvas id="minimap-canvas" width="160" height="120"></canvas>
        </div>
        
        <!-- Controls -->
        <div class="hud-panel" id="controls-panel">
            <span class="key">W</span><span class="key">S</span> 加速/减速 &nbsp;
            <span class="key">A</span><span class="key">D</span> 左右转向<br>
            <span class="key">Q</span><span class="key">E</span> 上升/下降 &nbsp;
            <span class="key">空格</span> 自动起飞<br>

        <!-- Location -->
        <div class="hud-panel" id="location-bar">

        </div>
        
        <!-- Flight Log -->

            <div id="log-entries"></div>
        </div>
    </div>
    
    <!-- Altitude bar -->
    <div id="alt-bar">
        <div id="alt-fill" style="height:0%"></div>
        <div id="alt-text">0m</div>
    </div>
    
    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
    // ═══════════════════════════════════════════════════════
    // FlyteOS v1.1 - Real-world 3D Flight Simulator
    // Data: ESRI World Imagery + Mapzen Terrain (100% Free)
    // ═══════════════════════════════════════════════════════
    
    const PROXY = window.location.hostname === 'localhost' 
        ? 'http://localhost:7890' 
        : '';
    
    // Location: Simulation area
    const CENTER_LAT = 28.0000;
    const CENTER_LNG = 112.0000;
    const HOME_POS = { lat: CENTER_LAT, lng: CENTER_LNG };
    
    // Terrain config
    const TERRAIN_SIZE = 4000; // meters
    const TERRAIN_SEGMENTS = 200;
    const MAX_ALTITUDE = 500; // meters
    const TERRAIN_EXAGGERATION = 3; // elevation exaggeration for visibility
    
    // Drone config
    const DRONE_SPEED = 20; // m/s
    const DRONE_TURN_SPEED = 60; // deg/s
    const DRONE_VERTICAL_SPEED = 10; // m/s
    
    // ═══════════════════════════════════════════════════════
    // THREE.JS SETUP
    // ═══════════════════════════════════════════════════════
    
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    
    const scene = new THREE.Scene();
    
    // Sky
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 2000, 8000);
    
    // Camera
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 20000);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const sunLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
    sunLight.position.set(500, 1000, 300);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 5000;
    sunLight.shadow.camera.left = -2000;
    sunLight.shadow.camera.right = 2000;
    sunLight.shadow.camera.top = 2000;
    sunLight.shadow.camera.bottom = -2000;
    scene.add(sunLight);
    
    // ═══════════════════════════════════════════════════════
    // TERRAIN CREATION (Satellite + Elevation)
    // ═══════════════════════════════════════════════════════
    
    function latLngToMeters(lat, lng) {
        const R = 6378137;
        const x = R * lng * Math.PI / 180;
        const y = R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * Math.PI / 180;
        return { x, y };
    }
    
    function metersToLatLng(x, y) {
        const R = 6378137;
        const lng = x / R * 180 / Math.PI;
        const lat = 2 * Math.atan(Math.exp(y / R * Math.PI)) * 180 / Math.PI - 90;
        return { lat, lng };
    }
    
    const centerMeters = latLngToMeters(CENTER_LAT, CENTER_LNG);
    
    // Create terrain geometry
    const terrainGeo = new THREE.PlaneGeometry(
        TERRAIN_SIZE, TERRAIN_SIZE, 
        TERRAIN_SEGMENTS, TERRAIN_SEGMENTS
    );
    terrainGeo.rotateX(-Math.PI / 2);
    
    // Load satellite texture
    function getSatelliteTileUrl(z, x, y) {
        return `${PROXY}/satellite/${z}/${x}/${y}.png`;
    }
    
    function getTerrainTileUrl(z, x, y) {
        return `${PROXY}/terrain/${z}/${x}/${y}.png`;
    }
    
    // Get tile coordinates from world position
    function worldToTile(worldX, worldZ, zoom) {
        const n = Math.pow(2, zoom);
        const x = Math.floor((worldX / TERRAIN_SIZE + 0.5) * n);
        const y = Math.floor((worldZ / TERRAIN_SIZE + 0.5) * n);
        return { x: Math.max(0, Math.min(n-1, x)), y: Math.max(0, Math.min(n-1, y)) };
    }
    
    // Canvas-based tile loader
    const tileCache = new Map();
    
    function loadImageTile(url) {
        return new Promise((resolve, reject) => {
            if (tileCache.has(url)) {
                resolve(tileCache.get(url));
                return;
            }
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                tileCache.set(url, img);
                resolve(img);
            };
            img.onerror = () => reject(new Error(`Failed to load: ${url}`));
            img.src = url;
        });
    }
    
    // Decoders for terrain tiles
    function decodeTerrariumHeight(r, g, b) {
        return (r * 256 + g + b / 256) - 32768;
    }
    
    // Build terrain with satellite + elevation
    async function buildTerrain() {
        const zoom = 12; // Tile zoom level
        const tilesPerSide = 4; // 4x4 tiles
        const tileSize = 512; // pixels per tile
        
        const satCanvas = document.createElement('canvas');
        satCanvas.width = tileSize * tilesPerSide;
        satCanvas.height = tileSize * tilesPerSide;
        const satCtx = satCanvas.getContext('2d');
        
        const elevCanvas = document.createElement('canvas');
        elevCanvas.width = tileSize * tilesPerSide;
        elevCanvas.height = tileSize * tilesPerSide;
        const elevCtx = elevCanvas.getContext('2d');
        
        const elevData = elevCtx.createImageData(elevCanvas.width, elevCanvas.height);
        
        updateLoading(10, '正在加载卫星影像...');
        
        // Load satellite tiles
        for (let ty = 0; ty < tilesPerSide; ty++) {
            for (let tx = 0; tx < tilesPerSide; tx++) {
                const url = getSatelliteTileUrl(zoom, tx, ty);
                try {
                    const img = await loadImageTile(url);
                    satCtx.drawImage(img, tx * tileSize, ty * tileSize, tileSize, tileSize);
                } catch(e) {
                    // Use a placeholder color on error
                    satCtx.fillStyle = '#3a5a3a';
                    satCtx.fillRect(tx * tileSize, ty * tileSize, tileSize, tileSize);
                }
                updateLoading(10 + (ty * tilesPerSide + tx) * 2, `正在加载卫星影像 (${ty * tilesPerSide + tx + 1}/16)...`);
            }
        }
        
        updateLoading(45, '正在加载地形高程...');
        
        // Load terrain tiles
        for (let ty = 0; ty < tilesPerSide; ty++) {
            for (let tx = 0; tx < tilesPerSide; tx++) {
                const url = getTerrainTileUrl(zoom, tx, ty);
                try {
                    const img = await loadImageTile(url);
                    elevCtx.drawImage(img, tx * tileSize, ty * tileSize, tileSize, tileSize);
                } catch(e) {
                    // Silently fail - terrain will be flat
                }
                updateLoading(45 + (ty * tilesPerSide + tx) * 2, `正在加载地形高程 (${ty * tilesPerSide + tx + 1}/16)...`);
            }
        }
        
        // Get elevation pixel data
        const elevPixels = elevCtx.getImageData(0, 0, elevCanvas.width, elevCanvas.height).data;
        
        updateLoading(75, '正在生成地形网格...');
        
        // Apply elevation to terrain
        const positions = terrainGeo.attributes.position;
        const segW = TERRAIN_SEGMENTS + 1;
        
        for (let i = 0; i < positions.count; i++) {
            const u = (positions.getX(i) / TERRAIN_SIZE + 0.5);
            const v = (positions.getZ(i) / TERRAIN_SIZE + 0.5);
            
            const px = Math.floor(u * elevCanvas.width);
            const py = Math.floor(v * elevCanvas.height);
            const clampedPx = Math.max(0, Math.min(elevCanvas.width - 1, px));
            const clampedPy = Math.max(0, Math.min(elevCanvas.height - 1, py));
            
            const idx = (clampedPy * elevCanvas.width + clampedPx) * 4;
            const r = elevPixels[idx];
            const g = elevPixels[idx + 1];
            const b = elevPixels[idx + 2];
            
            const height = decodeTerrariumHeight(r, g, b) * TERRAIN_EXAGGERATION;
            positions.setY(i, height);
        }
        
        terrainGeo.computeVertexNormals();
        terrainGeo.attributes.position.needsUpdate = true;
        
        updateLoading(85, '正在创建地形材质...');
        
        // Create satellite texture
        const satTexture = new THREE.CanvasTexture(satCanvas);
        satTexture.wrapS = THREE.ClampToEdgeWrapping;
        satTexture.wrapT = THREE.ClampToEdgeWrapping;
        
        // Terrain material
        const terrainMat = new THREE.MeshLambertMaterial({
            map: satTexture,
            side: THREE.DoubleSide,
        });
        
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.receiveShadow = true;
        terrain.position.set(0, 0, 0);
        scene.add(terrain);
        
        updateLoading(95, '正在设置飞行器...');
    }
    
    // ═══════════════════════════════════════════════════════
    // DRONE MODEL
    // ═══════════════════════════════════════════════════════
    
    function createDrone() {
        const droneGroup = new THREE.Group();
        
        // Body - streamlined aerostat shape
        const bodyGeo = new THREE.CapsuleGeometry(0.8, 3, 8, 16);
        bodyGeo.rotateZ(Math.PI / 2);
        const bodyMat = new THREE.MeshLambertMaterial({ 
            color: 0x1a3a5c,
            emissive: 0x002244,
            emissiveIntensity: 0.3,
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        droneGroup.add(body);
        
        // Solar panel (top)
        const solarGeo = new THREE.BoxGeometry(2.5, 0.05, 1.2);
        const solarMat = new THREE.MeshStandardMaterial({
            color: 0x1a237e,
            metalness: 0.9,
            roughness: 0.2,
            emissive: 0x0d1b4a,
            emissiveIntensity: 0.2,
        });
        const solar = new THREE.Mesh(solarGeo, solarMat);
        solar.position.y = 0.5;
        droneGroup.add(solar);
        
        // Solar panel grid lines
        const gridMat = new THREE.LineBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.5 });
        for (let i = -1; i <= 1; i += 0.5) {
            const lineGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-1.2, 0.53, i),
                new THREE.Vector3(1.2, 0.53, i)
            ]);
            droneGroup.add(new THREE.Line(lineGeo, gridMat));
        }
        
        // Propeller arms
        const armMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
        const armPositions = [[-1.5, 0, 1], [1.5, 0, 1], [-1.5, 0, -1], [1.5, 0, -1]];
        armPositions.forEach(pos => {
            const armGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.8, 6);
            const arm = new THREE.Mesh(armGeo, armMat);
            arm.position.set(...pos);
            arm.castShadow = true;
            droneGroup.add(arm);
            
            // Propeller disc
            const propGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.03, 16);
            const propMat = new THREE.MeshLambertMaterial({ 
                color: 0x3498db, 
                transparent: true, 
                opacity: 0.7,
                emissive: 0x1565c0,
                emissiveIntensity: 0.3,
            });
            const prop = new THREE.Mesh(propGeo, propMat);
            prop.position.set(pos[0], pos[1] + 0.4, pos[2]);
            prop.castShadow = true;
            prop.userData.isPropeller = true;
            prop.userData.rotorSpeed = 0;
            droneGroup.add(prop);
        });
        
        // Navigation lights
        const addNavLight = (color, position) => {
            const light = new THREE.PointLight(color, 0.5, 5);
            light.position.set(...position);
            droneGroup.add(light);
            
            const geo = new THREE.SphereGeometry(0.08, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(...position);
            droneGroup.add(mesh);
        };
        
        addNavLight(0xff0000, [-1.5, 0.5, 1.2]); // Red (left)
        addNavLight(0x00ff00, [1.5, 0.5, 1.2]);   // Green (right)
        addNavLight(0xffffff, [0, 0.5, -1.2]);   // White (tail)
        
        // Telemetry antenna
        const antGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 4);
        const antMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
        const ant = new THREE.Mesh(antGeo, antMat);
        ant.position.set(0, 1.2, -0.5);
        droneGroup.add(ant);
        
        const antBallGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const antBallMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const antBall = new THREE.Mesh(antBallGeo, antBallMat);
        antBall.position.set(0, 1.4, -0.5);
        droneGroup.add(antBall);
        
        return droneGroup;
    }
    
    // ═══════════════════════════════════════════════════════
    // DRONE FLIGHT STATE
    // ═══════════════════════════════════════════════════════
    
    const drone = createDrone();
    scene.add(drone);
    
    const droneState = {
        position: new THREE.Vector3(0, 50, 0), // Start at 50m altitude
        heading: 0, // degrees
        speed: 0, // m/s
        altitude: 50, // meters
        isFlying: false,
        isAutoMode: false,
        waypoints: [],
        currentWaypoint: 0,
        propellerSpeed: 0, // RPM
    };
    
    // Camera modes
    let cameraMode = 1; // 1=追跟随, 2=驾驶舱, 3=上帝视角
    
    const cameraTarget = new THREE.Vector3();
    const cameraOffset = new THREE.Vector3(0, 5, -15);
    
    // ═══════════════════════════════════════════════════════
    // MINIMAP
    // ═══════════════════════════════════════════════════════
    
    const minimapCanvas = document.getElementById('minimap-canvas');
    const minimapCtx = minimapCanvas.getContext('2d');
    
    function drawMinimap() {
        const w = minimapCanvas.width;
        const h = minimapCanvas.height;
        
        minimapCtx.fillStyle = '#001020';
        minimapCtx.fillRect(0, 0, w, h);
        
        // Grid
        minimapCtx.strokeStyle = 'rgba(0, 200, 255, 0.1)';
        minimapCtx.lineWidth = 0.5;
        for (let i = 0; i < 10; i++) {
            minimapCtx.beginPath();
            minimapCtx.moveTo(i * w / 10, 0);
            minimapCtx.lineTo(i * w / 10, h);
            minimapCtx.stroke();
            minimapCtx.beginPath();
            minimapCtx.moveTo(0, i * h / 10);
            minimapCtx.lineTo(w, i * h / 10);
            minimapCtx.stroke();
        }
        
        // Scale: 1 pixel = 20 meters
        const scale = 2; // px per meter
        const cx = w / 2;
        const cy = h / 2;
        
        // Drone position on minimap
        const droneX = cx + droneState.position.x * scale;
        const droneY = cy + droneState.position.z * scale;
        
        // Draw waypoints
        droneState.waypoints.forEach((wp, i) => {
            const wpX = cx + (wp.x - droneState.position.x) * scale;
            const wpY = cy + (wp.z - droneState.position.z) * scale;
            
            if (wpX > 0 && wpX < w && wpY > 0 && wpY < h) {
                minimapCtx.fillStyle = i === droneState.currentWaypoint ? '#ffdd00' : '#00d4ff';
                minimapCtx.beginPath();
                minimapCtx.arc(wpX, wpY, 4, 0, Math.PI * 2);
                minimapCtx.fill();
                minimapCtx.fillStyle = '#fff';
                minimapCtx.font = '9px Orbitron';
                minimapCtx.fillText(i + 1, wpX + 6, wpY + 4);
            }
        });
        
        // Draw drone direction
        minimapCtx.save();
        minimapCtx.translate(droneX, droneY);
        minimapCtx.rotate(-droneState.heading * Math.PI / 180);
        minimapCtx.fillStyle = '#00ff88';
        minimapCtx.beginPath();
        minimapCtx.moveTo(0, -6);
        minimapCtx.lineTo(-4, 4);
        minimapCtx.lineTo(4, 4);
        minimapCtx.closePath();
        minimapCtx.fill();
        minimapCtx.restore();
        
        // Range circle
        minimapCtx.strokeStyle = 'rgba(0, 212, 255, 0.2)';
        minimapCtx.lineWidth = 1;
        minimapCtx.beginPath();
        minimapCtx.arc(cx, cy, 200 * scale, 0, Math.PI * 2);
        minimapCtx.stroke();
    }
    
    // ═══════════════════════════════════════════════════════
    // INPUT HANDLING
    // ═══════════════════════════════════════════════════════
    
    const keys = {};
    
    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        
        // Takeoff
        if (e.code === 'Space' && !droneState.isFlying) {
            droneState.isFlying = true;
            droneState.isAutoMode = false;
            addLog('飞行器起飞！', 'takeoff');
            droneState.propellerSpeed = 3000;
        }
        
        // Camera switch
        if (e.code === 'Digit1') { cameraMode = 1; addLog('视角: 跟随模式'); }
        if (e.code === 'Digit2') { cameraMode = 2; addLog('视角: 驾驶舱'); }
        if (e.code === 'Digit3') { cameraMode = 3; addLog('视角: 上帝视角'); }
        
        // Hover
        if (e.code === 'Escape') {
            droneState.speed = 0;
            addLog('悬停模式');
        }
    });
    
    window.addEventListener('keyup', e => {
        keys[e.code] = false;
    });
    
    // Click to add waypoint
    canvas.addEventListener('click', e => {
        if (droneState.isFlying && droneState.waypoints.length < 10) {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -droneState.altitude);
            const point = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, point);
            
            if (point) {
                const wp = {
                    x: point.x,
                    y: droneState.altitude,
                    z: point.z,
                    reached: false
                };
                droneState.waypoints.push(wp);
                addLog(`航点${droneState.waypoints.length}已添加`, 'waypoint');
                createWaypointMarker(wp, droneState.waypoints.length);
            }
        }
    });
    
    // ═══════════════════════════════════════════════════════
    // WAYPOINT MARKERS
    // ═══════════════════════════════════════════════════════
    
    function createWaypointMarker(wp, num) {
        // Ground marker
        const markerGeo = new THREE.RingGeometry(3, 4, 32);
        markerGeo.rotateX(-Math.PI / 2);
        const markerMat = new THREE.MeshBasicMaterial({ 
            color: 0xffdd00, 
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.8,
        });
        const marker = new THREE.Mesh(markerGeo, markerMat);
        marker.position.set(wp.x, 0.1, wp.z);
        scene.add(marker);
        
        // Number label (canvas texture)
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 64;
        labelCanvas.height = 64;
        const labelCtx = labelCanvas.getContext('2d');
        labelCtx.fillStyle = 'rgba(255, 221, 0, 0.8)';
        labelCtx.beginPath();
        labelCtx.arc(32, 32, 28, 0, Math.PI * 2);
        labelCtx.fill();
        labelCtx.fillStyle = '#000';
        labelCtx.font = 'bold 36px Orbitron';
        labelCtx.textAlign = 'center';
        labelCtx.textBaseline = 'middle';
        labelCtx.fillText(num, 32, 32);
        
        const labelTex = new THREE.CanvasTexture(labelCanvas);
        const labelGeo = new THREE.PlaneGeometry(4, 4);
        const labelMat = new THREE.MeshBasicMaterial({ 
            map: labelTex, 
            transparent: true, 
            depthTest: false,
        });
        const label = new THREE.Mesh(labelGeo, labelMat);
        label.position.set(wp.x, droneState.altitude + 15, wp.z);
        label.userData.isBillboard = true;
        scene.add(label);
        
        // Vertical line
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(wp.x, 0.2, wp.z),
            new THREE.Vector3(wp.x, droneState.altitude + 14, wp.z),
        ]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xffdd00, transparent: true, opacity: 0.5 });
        scene.add(new THREE.Line(lineGeo, lineMat));
        
        // Landing marker at ground
        const landGeo = new THREE.RingGeometry(1.5, 2, 32);
        landGeo.rotateX(-Math.PI / 2);
        const landMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide });
        const land = new THREE.Mesh(landGeo, landMat);
        land.position.set(wp.x, 0.05, wp.z);
        scene.add(land);
    }
    
    // ═══════════════════════════════════════════════════════
    // FLIGHT LOG
    // ═══════════════════════════════════════════════════════
    
    const logEntries = document.getElementById('log-entries');
    
    function addLog(message, type = 'normal') {
        const now = new Date();
        const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `<span class="time">[${time}]</span>${message}`;
        logEntries.appendChild(entry);
        logEntries.scrollTop = logEntries.scrollHeight;
        
        // Keep only last 20 entries
        while (logEntries.children.length > 20) {
            logEntries.removeChild(logEntries.firstChild);
        }
    }
    
    // ═══════════════════════════════════════════════════════
    // FLIGHT LOGIC
    // ═══════════════════════════════════════════════════════
    
    function updateFlight(dt) {
        if (!droneState.isFlying) return;
        
        // Manual control
        if (keys['KeyW'] || keys['ArrowUp']) {
            droneState.speed = Math.min(droneState.speed + 15 * dt, DRONE_SPEED);
        } else if (keys['KeyS'] || keys['ArrowDown']) {
            droneState.speed = Math.max(droneState.speed - 20 * dt, 0);
        }
        
        if (keys['KeyA'] || keys['ArrowLeft']) {
            droneState.heading = (droneState.heading + DRONE_TURN_SPEED * dt) % 360;
        }
        if (keys['KeyD'] || keys['ArrowRight']) {
            droneState.heading = (droneState.heading - DRONE_TURN_SPEED * dt + 360) % 360;
        }
        
        if (keys['KeyQ']) {
            droneState.altitude = Math.min(droneState.altitude + DRONE_VERTICAL_SPEED * dt, MAX_ALTITUDE);
        }
        if (keys['KeyE']) {
            droneState.altitude = Math.max(droneState.altitude - DRONE_VERTICAL_SPEED * dt, 5);
        }
        
        // Auto mode - waypoint navigation
        if (droneState.isAutoMode && droneState.waypoints.length > 0) {
            const wp = droneState.waypoints[droneState.currentWaypoint];
            if (wp) {
                const dx = wp.x - droneState.position.x;
                const dz = wp.z - droneState.position.z;
                const distToWP = Math.sqrt(dx * dx + dz * dz);
                
                // Target heading
                const targetHeading = Math.atan2(-dx, -dz) * 180 / Math.PI;
                let diff = targetHeading - droneState.heading;
                while (diff > 180) diff -= 360;
                while (diff < -180) diff += 360;
                
                // Turn towards waypoint
                droneState.heading += Math.sign(diff) * Math.min(Math.abs(diff), DRONE_TURN_SPEED * dt);
                droneState.heading = (droneState.heading + 360) % 360;
                
                // Move towards waypoint
                if (Math.abs(diff) < 30) {
                    droneState.speed = Math.min(droneState.speed + 10 * dt, DRONE_SPEED);
                }
                
                // Check if reached waypoint
                if (distToWP < 5) {
                    wp.reached = true;
                    droneState.currentWaypoint++;
                    addLog(`航点${droneState.currentWaypoint}已到达！`, 'waypoint');
                    droneState.speed = 0;
                    
                    if (droneState.currentWaypoint >= droneState.waypoints.length) {
                        droneState.isAutoMode = false;
                        addLog('所有航点已完成！', 'waypoint');
                        droneState.currentWaypoint = 0;
                    }
                }
            }
        }
        
        // Start auto mode when waypoints exist and speed > 0
        if (droneState.waypoints.length > 0 && droneState.speed > 5 && !droneState.isAutoMode) {
            droneState.isAutoMode = true;
            addLog('自动驾驶模式已启动', 'takeoff');
        }
        
        // Update position
        const headingRad = droneState.heading * Math.PI / 180;
        droneState.position.x += Math.sin(headingRad) * droneState.speed * dt;
        droneState.position.z += Math.cos(headingRad) * droneState.speed * dt;
        droneState.position.y = droneState.altitude;
        
        // Clamp to terrain bounds
        const halfSize = TERRAIN_SIZE / 2 - 50;
        droneState.position.x = Math.max(-halfSize, Math.min(halfSize, droneState.position.x));
        droneState.position.z = Math.max(-halfSize, Math.min(halfSize, droneState.position.z));
        
        // Update drone mesh
        drone.position.copy(droneState.position);
        drone.rotation.y = headingRad;
        
        // Banking effect
        if (keys['KeyA'] || keys['ArrowLeft']) {
            drone.rotation.z = THREE.MathUtils.lerp(drone.rotation.z, 0.3, 0.1);
        } else if (keys['KeyD'] || keys['ArrowRight']) {
            drone.rotation.z = THREE.MathUtils.lerp(drone.rotation.z, -0.3, 0.1);
        } else {
            drone.rotation.z = THREE.MathUtils.lerp(drone.rotation.z, 0, 0.05);
        }
        
        // Propeller animation
        droneState.propellerSpeed = droneState.isFlying ? 3000 + droneState.speed * 100 : 0;
        drone.children.forEach(child => {
            if (child.userData.isPropeller) {
                child.userData.rotorSpeed += droneState.propellerSpeed * dt * 2;
                child.rotation.y = child.userData.rotorSpeed;
            }
        });
    }
    
    // ═══════════════════════════════════════════════════════
    // CAMERA
    // ═══════════════════════════════════════════════════════
    
    function updateCamera() {
        const headingRad = droneState.heading * Math.PI / 180;
        
        switch (cameraMode) {
            case 1: // Follow
                const targetPos = drone.position.clone();
                const offsetX = -Math.sin(headingRad) * 20;
                const offsetZ = -Math.cos(headingRad) * 20;
                camera.position.lerp(
                    new THREE.Vector3(
                        targetPos.x + offsetX,
                        targetPos.y + 8,
                        targetPos.z + offsetZ
                    ), 0.05
                );
                camera.lookAt(targetPos);
                break;
                
            case 2: // Cockpit
                const cockpitOffset = new THREE.Vector3(
                    Math.sin(headingRad) * 1.5,
                    1.5,
                    Math.cos(headingRad) * 1.5
                );
                camera.position.copy(drone.position.clone().add(cockpitOffset));
                const lookDir = new THREE.Vector3(
                    -Math.sin(headingRad) * 100,
                    -5,
                    -Math.cos(headingRad) * 100
                );
                camera.lookAt(drone.position.clone().add(lookDir));
                break;
                
            case 3: // God view
                camera.position.lerp(
                    new THREE.Vector3(drone.position.x, 500, drone.position.z - 50),
                    0.03
                );
                camera.lookAt(drone.position);
                break;
        }
    }
    
    // ═══════════════════════════════════════════════════════
    // HUD UPDATE
    // ═══════════════════════════════════════════════════════
    
    function updateHUD() {
        document.getElementById('tele-alt').innerHTML = 
            `${droneState.altitude.toFixed(1)}<span class="tele-unit">m</span>`;
        document.getElementById('tele-spd').innerHTML = 
            `${droneState.speed.toFixed(1)}<span class="tele-unit">m/s</span>`;
        document.getElementById('tele-hdg').innerHTML = 
            `${String(Math.round(droneState.heading)).padStart(3,'0')}<span class="tele-unit">°</span>`;
        document.getElementById('tele-wp').innerHTML = 
            `${droneState.waypoints.length}<span class="tele-unit">个</span>`;
        
        // GPS coordinates (approximate from position)
        const approxLat = CENTER_LAT + droneState.position.z / 111000;
        const approxLng = CENTER_LNG + droneState.position.x / (111000 * Math.cos(CENTER_LAT * Math.PI / 180));
        document.getElementById('tele-lat').textContent = `${approxLat.toFixed(5)}°`;
        document.getElementById('tele-lng').textContent = `${approxLng.toFixed(5)}°`;
        
        // Altitude bar
        const altPercent = (droneState.altitude / MAX_ALTITUDE) * 100;
        document.getElementById('alt-fill').style.height = `${altPercent}%`;
        document.getElementById('alt-text').textContent = `${Math.round(droneState.altitude)}m`;
        
        drawMinimap();
    }
    
    // ═══════════════════════════════════════════════════════
    // LOADING
    // ═══════════════════════════════════════════════════════
    
    function updateLoading(percent, text) {
        document.getElementById('loader-bar').style.width = `${percent}%`;
        document.getElementById('loader-text').textContent = text;
    }
    
    // ═══════════════════════════════════════════════════════
    // RENDER LOOP
    // ═══════════════════════════════════════════════════════
    
    let lastTime = performance.now();
    
    function animate() {
        requestAnimationFrame(animate);
        
        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.1); // Cap at 100ms
        lastTime = now;
        
        updateFlight(dt);
        updateCamera();
        updateHUD();
        
        // Billboard labels
        scene.traverse(obj => {
            if (obj.userData && obj.userData.isBillboard) {
                obj.lookAt(camera.position);
            }
        });
        
        renderer.render(scene, camera);
    }
    
    // ═══════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════
    
    async function init() {
        try {
            await buildTerrain();
            updateLoading(100, '加载完成！准备起飞...');
            
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }, 500);
            
            addLog('系统就绪，按空格键起飞');
            animate();
            
        } catch (err) {
            console.error('Init error:', err);
            document.getElementById('loader-text').textContent = '加载失败: ' + err.message;
            document.getElementById('loader-text').style.color = '#ff6b35';
        }
    }
    
    // Window resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    init();
    </script>
</body>
