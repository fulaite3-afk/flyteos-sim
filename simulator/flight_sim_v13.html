<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Noto Sans SC','微软雅黑',sans-serif}
#c{position:fixed;top:0;left:0;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
.panel{position:absolute;background:rgba(0,8,18,0.82);border:1px solid rgba(0,200,255,0.35);border-radius:5px;padding:12px 15px;color:#00d4ff;font-family:'Courier New',monospace;font-size:11px;backdrop-filter:blur(6px);pointer-events:auto}
#title{top:12px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}

.tu{color:#3a7a8f;font-size:9px;margin-left:3px}
#status{top:76px;right:14px;min-width:165px}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

#help{bottom:14px;left:50%;transform:translateX(-50%);font-size:9px;color:#2a4a5a;line-height:2;text-align:center;font-family:'Noto Sans SC',sans-serif;white-space:nowrap}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#000010;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .6s}
#loading h1{font-family:'Courier New',monospace;font-size:24px;color:#00d4ff;text-shadow:0 0 24px #00d4ff,0 0 60px rgba(0,212,255,.3);letter-spacing:8px;margin-bottom:8px}
#loading .ver{font-size:11px;color:#5ba3b8;letter-spacing:3px;margin-bottom:40px}
#prog-bar{width:360px;height:3px;background:#0a1520;border-radius:2px;overflow:hidden;margin-bottom:10px}
#prog-fill{height:100%;background:linear-gradient(90deg,#0066cc,#00d4ff,#00ff88);width:0%;transition:width .4s}
#prog-text{font-size:10px;color:#5ba3b8;font-family:'Noto Sans SC',sans-serif}
#speedmeter{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);width:90px;height:26px;background:rgba(0,8,18,.75);border:1px solid rgba(0,200,255,.2);border-radius:13px;display:flex;align-items:center;justify-content:center;z-index:11;gap:4px}
#speedmeter .sm-val{font-family:'Courier New',monospace;font-size:14px;font-weight:700;color:#00d4ff}
#speedmeter .sm-unit{font-size:9px;color:#3a7a8f}
#fps-counter{position:fixed;top:14px;right:14px;font-family:'Courier New',monospace;font-size:10px;color:#00ff88;z-index:12;background:rgba(0,8,18,.7);padding:3px 8px;border-radius:4px;border:1px solid rgba(0,255,136,.3)}
#cloud-indicator{top:148px;left:50%;transform:translateX(-50%);background:rgba(0,8,18,.8);border:1px solid rgba(100,180,255,.25);border-radius:16px;padding:5px 18px;color:#fff;font-size:10px;font-family:'Noto Sans SC',sans-serif;z-index:11;position:fixed;white-space:nowrap;pointer-events:none}
#altbar{position:fixed;right:270px;top:50%;transform:translateY(-50%);width:16px;height:200px;background:rgba(0,8,18,.7);border:1px solid rgba(0,200,255,.2);border-radius:8px;overflow:hidden;z-index:11}
#altbar-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#0066cc,#00d4ff,#00ff88);border-radius:8px;transition:height .2s}
#through-cloud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9;opacity:0;transition:opacity .6s}
#log{position:fixed;top:280px;left:14px;width:210px;max-height:160px;overflow:hidden;background:rgba(0,8,18,0.82);border:1px solid rgba(0,200,255,0.35);border-radius:5px;padding:12px 15px;color:#00d4ff;font-family:'Courier New',monospace;font-size:11px;z-index:10;pointer-events:auto}
#log-title{font-size:9px;color:#5ba3b8;margin-bottom:5px}
.le{font-size:9px;color:#7ec8e3;line-height:1.7;font-family:'Noto Sans SC',sans-serif}
.le.warn{color:#ffaa00}
</style>

<body>

<!-- 加载界面 -->
<div id="loading">
  <h1>FLYTEOS</h1>
  <div class="ver">v1.4 · 浮空飞行器</div>
  <div id="prog-bar"><div id="prog-fill"></div></div>
  <div id="prog-text">正在初始化...</div>
</div>

<canvas id="c"></canvas>
<div id="through-cloud"></div>

<!-- HUD -->
<div id="hud">
  <div class="panel" id="title"><h1>FLYTEOS v1.4</h1><div class="sub">武汉福莱特航空科技 · 浮空飞行器模拟器</div></div>
  <div class="panel" id="tele">
    <div class="tr"><span class="tl">高度 ALT</span><span><span class="tv" id="tv-alt">0.0</span><span class="tu">m</span></span></div>
    <div class="tr"><span class="tl">速度 SPD</span><span><span class="tv" id="tv-spd">0.0</span><span class="tu">m/s</span></span></div>
    <div class="tr"><span class="tl">航向 HDG</span><span><span class="tv" id="tv-hdg">000</span><span class="tu">°</span></span></div>

  </div>

  <div class="panel" id="status">
    <div class="si"><div class="sd on" id="sd-pwr"></div><span>电源系统</span></div>
    <div class="si"><div class="sd on" id="sd-gps"></div><span>GPS导航</span></div>

  <div id="help">WASD 移动 | Q 上升 | E 下降 | 空格 起飞 | 1/2/3 视角</div>

</div>

<!-- Three.js 本地优先 -->
<script src="three.min.js" onerror="this.src='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'"></script>

<script>
// ═══════════════════════════════════════════════════════════════
//  FlyteOS v1.4 — 重写版：同步初始化、零await、保证画面能动
// ═══════════════════════════════════════════════════════════════

'use strict';

// ── 安全检查 ──
if (typeof THREE === 'undefined') {
  document.getElementById('prog-text').textContent = 'Three.js 加载失败';
  throw new Error('Three.js not loaded');
}

// ═══════════════════════════════════════════════════════════════
//  常量
// ═══════════════════════════════════════════════════════════════
const TERRAIN_SIZE = 6000;
const TERRAIN_SEG  = 150;    // 150x150分段，足够好看又不卡
const MAX_ALT      = 320;
const DRONE_SPEED  = 18;
const DRONE_VS_UP  = 8;
const DRONE_VS_DN  = 5;
const DRONE_TURN   = 60;
const TAKEOFF_ALT  = 30;

// ═══════════════════════════════════════════════════════════════
//  飞行状态（全局可变对象）
// ═══════════════════════════════════════════════════════════════
const flight = {
  x: 0, z: 0,          // 水平位置
  alt: 2,               // 离地高度
  hdg: 0,               // 航向度
  spd: 0,               // 水平速度
  vs: 0,                // 垂直速度
  propRPM: 0,
  phase: 'GROUNDED',    // GROUNDED / TAKEOFF / HOVER / FLIGHT / LANDING
  isAuto: false,
  autoIdx: 0,
  autoTimer: 0,
};

const keys = {};

// ═══════════════════════════════════════════════════════════════
//  Three.js 核心 — 全部同步初始化
// ═══════════════════════════════════════════════════════════════

// 渲染器（WebGL检测+降级）
const canvas = document.getElementById('c');
let _fallback2D = false;
let renderer;
try {
  const tc = document.createElement('canvas');
  const gl = tc.getContext('webgl2') || tc.getContext('webgl');
  if (!gl) throw new Error('no WebGL');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
} catch(e) {
  console.warn('[FlyteOS] WebGL不可用，使用2D模式:', e.message);
  _fallback2D = true;
  renderer = null;
}

// 场景
const scene = new THREE.Scene();
if (!_fallback2D) {
  scene.background = new THREE.Color(0x8abed8);
  scene.fog = new THREE.FogExp2(0x8abed8, 0.00008);
}

// 相机
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 26000);
camera.position.set(0, 16, -32);
camera.lookAt(0, 2, 0);

// 光照
if (!_fallback2D) {
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.8);
  sun.position.set(300, 500, 200);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x446688, 0.6));
  scene.add(new THREE.HemisphereLight(0x8abed8, 0x3a5a3a, 0.4));
}

// ═══════════════════════════════════════════════════════════════
//  地形（同步生成，无异步）
// ═══════════════════════════════════════════════════════════════

// 简单2D噪声
function _hash(x, y) {
  let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}
function _smooth(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = _hash(ix, iy), b = _hash(ix+1, iy);
  const c = _hash(ix, iy+1), d = _hash(ix+1, iy+1);
  return a + (b-a)*sx + (c-a)*sy + (a-b-c+d)*sx*sy;
}
function terrainNoise(x, y) {
  let v = 0, amp = 1, freq = 1, total = 0;
  for (let i = 0; i < 5; i++) {
    v += _smooth(x * freq, y * freq) * amp;
    total += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return v / total;
}

// 地形高度函数（给飞行物理用）
function getTerrainY(wx, wz) {
  const nx = wx / TERRAIN_SIZE * 6;
  const nz = wz / TERRAIN_SIZE * 6;
  const e = terrainNoise(nx + 10, nz + 10);
  return Math.max(0, (e - 0.3) * 120);
}

// 生成地形Mesh（3D模式）
if (!_fallback2D) {
  const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
  terrainGeo.rotateX(-Math.PI / 2);

  const pos = terrainGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const nx = x / TERRAIN_SIZE * 6, nz = z / TERRAIN_SIZE * 6;
    const e = terrainNoise(nx + 10, nz + 10);
    const h = Math.max(0, (e - 0.3) * 120);
    pos.setY(i, h);

    let r, g, b;
    if (h < 1)       { r = 0.12; g = 0.25; b = 0.45; }
    else if (h < 15)  { r = 0.25; g = 0.50; b = 0.22; }
    else if (h < 40)  { r = 0.18; g = 0.38; b = 0.16; }
    else if (h < 70)  { r = 0.40; g = 0.36; b = 0.28; }
    else              { r = 0.65; g = 0.63; b = 0.60; }
    colors[i*3] = r; colors[i*3+1] = g; colors[i*3+2] = b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();

  const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0.02 });
  const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
  terrainMesh.receiveShadow = true;
  scene.add(terrainMesh);
}

// ═══════════════════════════════════════════════════════════════
//  飞行器模型（简洁的浮空器）
// ═══════════════════════════════════════════════════════════════
function createAerostat() {
  const group = new THREE.Group();

  // 气囊（椭球体）
  const envelopeGeo = new THREE.SphereGeometry(1, 20, 14);
  envelopeGeo.scale(0.7, 0.5, 1.0);
  const envelopeMat = new THREE.MeshStandardMaterial({ color: 0xe8e8f0, roughness: 0.4, metalness: 0.1 });
  const envelope = new THREE.Mesh(envelopeGeo, envelopeMat);
  envelope.position.y = 0.6;
  group.add(envelope);

  // 吊舱
  const gondolaGeo = new THREE.BoxGeometry(0.35, 0.2, 0.5);
  const gondolaMat = new THREE.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.6 });
  const gondola = new THREE.Mesh(gondolaGeo, gondolaMat);
  gondola.position.y = -0.15;
  group.add(gondola);

  // 螺旋桨x4
  for (let i = 0; i < 4; i++) {
    const propGeo = new THREE.BoxGeometry(0.03, 0.25, 0.02);
    const propMat = new THREE.MeshStandardMaterial({ color: 0x44ddff, emissive: 0x226688, transparent: true, opacity: 0.8 });
    const prop = new THREE.Mesh(propGeo, propMat);
    prop.userData.isProp = true;
    const angle = (i / 4) * Math.PI * 2;
    prop.position.set(Math.cos(angle) * 0.55, 0.25, Math.sin(angle) * 0.55);
    group.add(prop);
  }

  // 底部指示灯
  const lightGeo = new THREE.SphereGeometry(0.05, 6, 6);
  const lightMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
  const light = new THREE.Mesh(lightGeo, lightMat);
  light.position.y = -0.3;
  group.add(light);

  return group;
}

const drone = _fallback2D ? new THREE.Group() : createAerostat();
if (!_fallback2D) drone.scale.setScalar(2.5);
drone.position.set(0, flight.alt, 0);
scene.add(drone);

// ═══════════════════════════════════════════════════════════════
//  云层（3D模式）
// ═══════════════════════════════════════════════════════════════
const clouds = [];
if (!_fallback2D) {
  for (let i = 0; i < 30; i++) {
    const cloudGroup = new THREE.Group();
    const count = 3 + Math.floor(Math.random() * 4);
    for (let j = 0; j < count; j++) {
      const r = 15 + Math.random() * 25;
      const geo = new THREE.SphereGeometry(r, 8, 6);
      const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.65 });
      const puff = new THREE.Mesh(geo, mat);
      puff.position.set((Math.random()-0.5)*30, (Math.random()-0.5)*5, (Math.random()-0.5)*30);
      cloudGroup.add(puff);
    }
    cloudGroup.position.set(
      (Math.random()-0.5) * TERRAIN_SIZE * 0.7,
      100 + Math.random() * 190,
      (Math.random()-0.5) * TERRAIN_SIZE * 0.7
    );
    scene.add(cloudGroup);
    clouds.push(cloudGroup);
  }
}

// ═══════════════════════════════════════════════════════════════
//  键盘输入
// ═══════════════════════════════════════════════════════════════
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (flight.phase === 'GROUNDED') {
      flight.phase = 'TAKEOFF';
      flight.propRPM = 1500;
      addLog('手动起飞！', 'info');
      setPhase('起飞', '爬升中...');
    }
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ═══════════════════════════════════════════════════════════════
//  自动任务
// ═══════════════════════════════════════════════════════════════
const MISSION = [
  { cmd: 'takeoff', alt: 80 },
  { cmd: 'goto', x: 300, z: -200, alt: 100 },
  { cmd: 'goto', x: -150, z: -400, alt: 120 },
  { cmd: 'goto', x: -300, z: 100, alt: 90 },
  { cmd: 'goto', x: 0, z: 0, alt: 80 },
  { cmd: 'land' },
];

function startAutoMission() {
  if (flight.isAuto) return;
  flight.isAuto = true;
  flight.autoIdx = 0;
  flight.autoTimer = 0;
  flight.phase = 'TAKEOFF';
  flight.propRPM = 1500;
  addLog('自动任务启动', 'info');
  setPhase('起飞', '自动任务进行中');
  document.getElementById('btn-mission').disabled = true;
  document.getElementById('mission-status').textContent = '任务执行中...';
}

// ═══════════════════════════════════════════════════════════════
//  飞行物理更新（每帧调用）
// ═══════════════════════════════════════════════════════════════
function updateFlight(dt) {
  const groundY = getTerrainY(flight.x, flight.z);

  // ── 自动任务 ──
  if (flight.isAuto) {
    updateAutoMission(dt, groundY);
  }

  // ── 手动控制（非自动或手动飞行阶段）──
  if (!flight.isAuto) {
    if (flight.phase === 'HOVER' || flight.phase === 'FLIGHT') {
      if (keys['KeyW']) {
        const rad = flight.hdg * Math.PI / 180;
        flight.x += Math.sin(rad) * DRONE_SPEED * dt;
        flight.z -= Math.cos(rad) * DRONE_SPEED * dt;
        flight.spd = DRONE_SPEED;
      } else if (keys['KeyS']) {
        const rad = flight.hdg * Math.PI / 180;
        flight.x -= Math.sin(rad) * DRONE_SPEED * 0.5 * dt;
        flight.z += Math.cos(rad) * DRONE_SPEED * 0.5 * dt;
        flight.spd = DRONE_SPEED * 0.5;
      } else {
        flight.spd *= Math.max(0, 1 - 3 * dt);
      }
      if (keys['KeyA']) flight.hdg = (flight.hdg - DRONE_TURN * dt + 360) % 360;
      if (keys['KeyD']) flight.hdg = (flight.hdg + DRONE_TURN * dt) % 360;
      if (keys['KeyQ']) { flight.vs = DRONE_VS_UP; flight.alt += flight.vs * dt; }
      else if (keys['KeyE']) { flight.vs = -DRONE_VS_DN; flight.alt += flight.vs * dt; }
      else { flight.vs *= Math.max(0, 1 - 5 * dt); }
    }
  }

  // ── 起飞阶段 ──
  if (flight.phase === 'TAKEOFF') {
    flight.alt += DRONE_VS_UP * dt;
    flight.vs = DRONE_VS_UP;
    flight.propRPM = Math.min(flight.propRPM + 800 * dt, 2800);
    if (flight.alt >= TAKEOFF_ALT) {
      flight.alt = TAKEOFF_ALT;
      flight.phase = 'HOVER';
      flight.vs = 0;
      setPhase('悬停', 'WASD移动 Q/E升降');
      addLog('到达起飞高度', 'info');
    }
  }

  // ── 安全限制 ──
  if (flight.alt < groundY + 0.5) {
    flight.alt = groundY + 0.5;
    if (flight.vs < 0) flight.vs = 0;
    if (flight.phase === 'LANDING') {
      flight.phase = 'GROUNDED';
      flight.propRPM = 0;
      flight.spd = 0;
      flight.vs = 0;
      flight.isAuto = false;
      setPhase('待机', '按 [空格] 起飞');
      addLog('着陆完成', 'info');
      document.getElementById('btn-mission').disabled = false;
      document.getElementById('mission-status').textContent = '点击开始';
    }
  }
  if (flight.alt > MAX_ALT) { flight.alt = MAX_ALT; if (flight.vs > 0) flight.vs = 0; }

  // ── 更新3D模型位置 ──
  if (!_fallback2D) {
    drone.position.set(flight.x, flight.alt, flight.z);
    drone.rotation.y = flight.hdg * Math.PI / 180;
    // 螺旋桨旋转
    if (flight.propRPM > 0) {
      drone.traverse(o => {
        if (o.userData.isProp) o.rotation.x += dt * flight.propRPM * 0.001;
      });
    }
  }

  // HOVER/FLIGHT阶段有移动则切换
  if (flight.phase === 'HOVER' && flight.spd > 1) flight.phase = 'FLIGHT';
  if (flight.phase === 'FLIGHT' && flight.spd < 0.5) flight.phase = 'HOVER';
}

function updateAutoMission(dt, groundY) {
  if (flight.autoIdx >= MISSION.length) {
    flight.isAuto = false;
    return;
  }
  const step = MISSION[flight.autoIdx];

  if (step.cmd === 'takeoff') {
    flight.alt += DRONE_VS_UP * dt;
    flight.vs = DRONE_VS_UP;
    flight.propRPM = Math.min(flight.propRPM + 800 * dt, 2800);
    if (flight.alt >= step.alt) {
      flight.alt = step.alt;
      flight.phase = 'HOVER';
      flight.vs = 0;
      flight.autoIdx++;
      setPhase('巡航', '航点 ' + flight.autoIdx + '/' + MISSION.length);
      addLog('到达巡航高度 ' + step.alt + 'm', 'info');
    }
  } else if (step.cmd === 'goto') {
    const dx = step.x - flight.x, dz = step.z - flight.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    // 调整航向
    const targetHdg = (Math.atan2(dx, -dz) * 180 / Math.PI + 360) % 360;
    let diff = targetHdg - flight.hdg;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    flight.hdg = (flight.hdg + diff * 3 * dt + 360) % 360;
    // 移动
    const spd = Math.min(DRONE_SPEED, dist * 0.5 + 2);
    flight.spd = spd;
    const rad = flight.hdg * Math.PI / 180;
    flight.x += Math.sin(rad) * spd * dt;
    flight.z -= Math.cos(rad) * spd * dt;
    // 高度调整
    const altDiff = step.alt - flight.alt;
    flight.vs = Math.max(-DRONE_VS_DN, Math.min(DRONE_VS_UP, altDiff * 0.5));
    flight.alt += flight.vs * dt;
    flight.propRPM = 2400;
    // 到达判定
    if (dist < 15) {
      flight.autoIdx++;
      addLog('到达航点 ' + flight.autoIdx, 'info');
      if (flight.autoIdx < MISSION.length) {
        setPhase('巡航', '航点 ' + flight.autoIdx + '/' + MISSION.length);
      }
    }
  } else if (step.cmd === 'land') {
    flight.vs = -DRONE_VS_DN * 0.6;
    flight.alt += flight.vs * dt;
    flight.spd *= Math.max(0, 1 - dt);
    flight.propRPM = Math.max(800, flight.propRPM - 200 * dt);
    flight.phase = 'LANDING';
    setPhase('降落', '自动降落中...');
  }
}

// ═══════════════════════════════════════════════════════════════
//  相机跟随
// ═══════════════════════════════════════════════════════════════
let camMode = 1;  // 1=跟随 2=俯瞰 3=远景
const camOffset = { 1: {x:0, y:14, z:-32}, 2: {x:0, y:80, z:-5}, 3: {x:0, y:300, z:-100} };

function updateCamera() {
  const off = camOffset[camMode];
  const targetX = flight.x + off.x;
  const targetY = flight.alt + off.y;
  const targetZ = flight.z + off.z;
  camera.position.x += (targetX - camera.position.x) * 0.05;
  camera.position.y += (targetY - camera.position.y) * 0.05;
  camera.position.z += (targetZ - camera.position.z) * 0.05;
  camera.lookAt(flight.x, flight.alt, flight.z);
}

// ═══════════════════════════════════════════════════════════════
//  HUD更新
// ═══════════════════════════════════════════════════════════════
function updateHUD() {
  const groundY = getTerrainY(flight.x, flight.z);
  const agl = Math.max(0, flight.alt - groundY);

  document.getElementById('tv-alt').textContent = flight.alt.toFixed(1);
  document.getElementById('tv-spd').textContent = flight.spd.toFixed(1);
  document.getElementById('tv-hdg').textContent = String(Math.round(flight.hdg)).padStart(3, '0');
  document.getElementById('tv-agl').textContent = agl.toFixed(1);
  document.getElementById('sm-spd').textContent = flight.spd.toFixed(1);

  const vsEl = document.getElementById('tv-vs');
  vsEl.textContent = (flight.vs >= 0 ? '+' : '') + flight.vs.toFixed(1);
  vsEl.style.color = flight.vs > 0.5 ? '#00ff88' : flight.vs < -0.5 ? '#ffaa00' : '#00d4ff';

  document.getElementById('altbar-fill').style.height = Math.min(agl / MAX_ALT * 100, 100) + '%';

  // 电机状态
  const motorEl = document.getElementById('sd-motor');
  if (motorEl && flight.propRPM > 100) motorEl.classList.add('on');
}

// ═══════════════════════════════════════════════════════════════
//  辅助函数
// ═══════════════════════════════════════════════════════════════
function addLog(msg, type) {
  const el = document.getElementById('log-entries');
  if (!el) return;
  const d = document.createElement('div');
  d.className = 'le' + (type === 'warn' ? ' warn' : '');
  const now = new Date();
  d.textContent = `[${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}] ${msg}`;
  el.prepend(d);
  if (el.children.length > 20) el.removeChild(el.lastChild);
}

function setPhase(title, desc) {
  document.getElementById('phase-text').textContent = title;
  document.getElementById('phase-desc').textContent = desc;
}

// ═══════════════════════════════════════════════════════════════
//  渲染循环（setTimeout，最可靠）
// ═══════════════════════════════════════════════════════════════
let lastTime = performance.now();
let fpsFrames = 0, fpsTime = 0, fpsDisplay = 0;

function tick() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // FPS
  fpsFrames++;
  if (now - fpsTime >= 1000) {
    fpsDisplay = fpsFrames;
    fpsFrames = 0;
    fpsTime = now;
    document.getElementById('fps-counter').textContent = 'FPS: ' + fpsDisplay;
  }

  try { updateFlight(dt); } catch(e) { console.error('updateFlight:', e); }
  try { updateCamera(); } catch(e) { console.error('updateCamera:', e); }
  try { updateHUD(); } catch(e) { console.error('updateHUD:', e); }

  if (_fallback2D) {
    render2D();
  } else {
    try { renderer.render(scene, camera); } catch(e) {
      console.error('render:', e);
      _fallback2D = true;
    }
  }

  setTimeout(tick, 16);
}

// ── 2D降级渲染 ──
function render2D() {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  if (!ctx) return;
  const W = c.width = innerWidth, H = c.height = innerHeight;

  // 天空渐变
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#4a8ab8');
  grad.addColorStop(0.5, '#8abed8');
  grad.addColorStop(1, '#2a5a3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 网格
  ctx.strokeStyle = 'rgba(0,180,255,0.08)';
  ctx.lineWidth = 1;
  const gs = 60;
  for (let x = W/2 % gs; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = H/2 % gs; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // 飞行器图标
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(flight.hdg * Math.PI / 180);
  ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(-10,10); ctx.lineTo(0,4); ctx.lineTo(10,10); ctx.closePath();
  ctx.fillStyle = '#00ff88'; ctx.fill();
  ctx.strokeStyle = '#00ffaa'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();

  // HUD叠加
  ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
  ctx.fillText('2D模式 (WebGL不可用)', W/2, 28);
  ctx.fillStyle = '#00d4ff'; ctx.font = '11px monospace';
  ctx.fillText(`ALT:${flight.alt.toFixed(1)}m  SPD:${flight.spd.toFixed(1)}m/s  HDG:${String(Math.round(flight.hdg)).padStart(3,'0')}°  FPS:${fpsDisplay}`, W/2, 48);
}

// ═══════════════════════════════════════════════════════════════
//  视角切换
// ═══════════════════════════════════════════════════════════════
window.addEventListener('keydown', e => {
  if (e.code === 'Digit1') camMode = 1;
  if (e.code === 'Digit2') camMode = 2;
  if (e.code === 'Digit3') camMode = 3;
});

// ═══════════════════════════════════════════════════════════════
//  窗口resize
// ═══════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  try {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    if (renderer && !_fallback2D) renderer.setSize(innerWidth, innerHeight);
  } catch(e) {}
});

// ═══════════════════════════════════════════════════════════════
//  启动！同步完成，零延迟
// ═══════════════════════════════════════════════════════════════
document.getElementById('prog-fill').style.width = '100%';
document.getElementById('prog-text').textContent = '就绪！';

addLog('FlyteOS v1.4 就绪', 'info');
addLog('按 [空格] 起飞 | WASD移动 | Q/E升降', 'info');

// 隐藏加载屏
const loadEl = document.getElementById('loading');
loadEl.style.opacity = '0';
setTimeout(() => { loadEl.style.display = 'none'; }, 600);

// 启动渲染循环
lastTime = performance.now();
fpsTime = lastTime;
tick();

</script>
